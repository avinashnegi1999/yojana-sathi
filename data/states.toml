# =====================================================================
# States and union territories — for the `state` profile field
# =====================================================================
# * Coarse location only. There is no district and no village field anywhere in
# * this project, and a state alone cannot re-identify a worker.
#
# * A typed answer is matched against label_hi / label_en / aliases by plain
# * substring — no LLM needed. `common = true` states appear as buttons first
# * (Uttarakhand and its neighbours: that is where the pilot runs).

