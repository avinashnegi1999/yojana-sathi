keywords_en = ["tailor", "weaving", "embroidery", "artisan", "handicraft", "beedi", "silai", "bunai", "kadhai", "beedi", "agarbatti", "karigar", "dastkar"]

# ! Being out of work is an ANSWER, not a missing answer. It was left out of the
# ! first draft and a real tester hit it in the first five minutes: "i dont do
# ! any job" had nowhere to go. The schemes we handle do not test occupation at
# ! all, so someone with no work is screened exactly like anyone else.
[[occupation]]
code        = "no_work"
label_hi    = "अभी कोई काम नहीं है"
label_en    = "Not working right now"
emoji       = "🚫"
keywords_hi = ["काम नहीं", "बेरोज़गार", "बेरोजगार", "कुछ नहीं करता", "खाली", "नौकरी नहीं", "काम नहीं मिलता", "कोई काम नहीं", "बेकार"]
keywords_en = ["no job", "no work", "unemployed", "jobless", "nothing", "not working", "dont work", "don't work", "dont do any job", "do not do any job", "dont have a job", "no employment", "not employed", "berojgar", "berozgar", "kaam nahi", "koi kaam nahi", "kuch nahi karta", "kuch bhi nahi", "bekar", "ghar par hu", "ghar par rehta"]

# ! "other" is a real answer, not a failure. A worker whose job does not fit
# ! must still be screened — the schemes we handle are mostly occupation-blind.
[[occupation]]
code        = "other"
label_hi    = "कोई और काम"
label_en    = "Something else"
emoji       = "➕"
keywords_hi = []
keywords_en = []
