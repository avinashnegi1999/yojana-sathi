# =====================================================================
# Occupation categories — the intake menu, NOT scheme rules
# =====================================================================
# * These are the eight pictorial categories a worker picks from, plus a
# * free-text escape. They are a UI list, so they are safe for me to author.
#
# ! A scheme that defines its own occupation list (e.g. "building & other
# ! construction worker" as the BOCW Act defines it) must map to these codes
# ! during research — put the mapping in the scheme's [[criteria]] value list,
# ! never by quietly renaming a code here.
#
# keywords_hi / keywords_en are for the NO-LLM path: free text is matched
# against them by plain substring, then confirmed back to the worker. They are
# a convenience, never an authority — a match is always confirmed, never
# recorded silently.
#
# ! keywords_en carries ROMANISED HINDI too ("berojgar", "kaam nahi", "gaadi").
# ! Plenty of people type Hindi in Latin letters, and the first real tester did
# ! exactly that. It costs nothing here and saves a menu round-trip.
#
# * A phrase that matches nothing is no longer a dead end: the flow proposes
# * "something else" and asks the worker to confirm it, so free text always has
# * somewhere to go.

[[occupation]]
code        = "construction"
label_hi    = "निर्माण मजदूर"
label_en    = "Construction worker"
emoji       = "🧱"
keywords_hi = ["ईंट", "मिस्त्री", "राजमिस्त्री", "बेलदार", "निर्माण", "मकान", "सीमेंट", "मजदूरी", "ईंट", "मिस्त्री"]
keywords_en = ["mason", "construction", "builder", "brick", "labourer", "mistri", "rajmistri", "beldar", "nirman", "majdoori", "makan", "cement", "site par kaam"]

[[occupation]]
code        = "agriculture"
label_hi    = "खेती / खेत मजदूर"
label_en    = "Farm worker or small farmer"
emoji       = "🌾"
keywords_hi = ["खेत", "खेती", "किसान", "फसल", "बुवाई", "कटाई"]
keywords_en = ["farm", "farmer", "agriculture", "crop", "field", "kheti", "khet", "kisan", "fasal", "khet mazdoor"]

[[occupation]]
code        = "domestic_work"
