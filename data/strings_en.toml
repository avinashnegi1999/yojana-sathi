# =====================================================================
# Every user-facing string, in English
# =====================================================================
# ! This file must contain EVERY key that data/strings_hi.toml contains.
# ! sathi/core/content.py asserts that, because a half-translated screen is
# ! worse than either language on its own. A key missing here silently falls
# ! back to Hindi at runtime, and the test is what stops that shipping.
#
# ! Same rule as the Hindi file: nothing here may state a threshold, a ₹ amount
# ! or a verdict. Those live in data/schemes/*.toml with a source_url.
#
# * English is here for two real readers: younger workers who read English
# * faster than Devanagari, and the CSC operator or NGO volunteer running this
# * on someone else's behalf. Hindi remains the default.

