# =====================================================================
[commands]
# =====================================================================
help = """I tell you which government schemes you may be entitled to.

/start — begin, or start again
/language — switch between हिंदी and English
/schemes — which schemes I know, and where their rules come from
/privacy — what I store, and what I never ask for
/about — what this is, and what it is not
/clear — delete this conversation's messages
/clearall — delete everything from the last 48 hours
/cancel — stop and forget this session

Answer by tapping the buttons. You can also type your age or your state."""
about = """Yojana Sathi is a free, open-source helper for workers in the unorganised sector.

It is NOT a government service and NOT an agent. It does not submit any application for you and it never asks for money.

The government already publishes this information on myScheme.gov.in — but that is a web form that assumes you can read, use a browser and know what "land holding in hectares" means. This is the same information as a spoken conversation, ending in a list you can carry to a centre.

Eligibility here is decided by fixed rules taken from official government pages, not by an AI guessing. Where we have not checked a rule, we say so instead of guessing."""
privacy = """What I never ask for: your name, your phone number, your Aadhaar number. Those fields do not exist anywhere in this system, so they cannot be stored by accident.

What is kept: counts only — the state, an age band (like 26-40), the kind of work, and an income band. No exact age, no exact income, no village.

Your answers live in memory only while we talk, and are gone when the session ends. Each session gets a random number that is not linked to your account on this app, so two visits by you cannot be joined together.

The sheet I make for you is sent to you and never saved on our side."""
schemes_header = """These are the schemes I check, and where their rules come from.
Every rule has an official source you can check yourself:"""
schemes_line = """• {name} ({code})
   Source: {url}
   Rules checked on: {verified_on}"""
schemes_unverified = "   ⚠ Not yet checked against an official source — I will say “I don't know” for this one."
cancelled = "Stopped. Nothing was saved. Send /start to begin again."
# ! Telegram only lets a bot delete messages under 48 hours old. Say so.
cleared = "Deleted {count} message(s) — the ones from this conversation I still had a record of. Send /clearall to also remove older ones."
cleared_all = "Cleared everything I could reach from the last 48 hours. Telegram does not let a bot delete messages older than that, so anything older stays — you can remove those yourself."
clear_nothing = "There was nothing to delete."
# ! Not every channel lets a bot delete its own messages — the WhatsApp
# ! Cloud API has no delete endpoint at all. Say that plainly rather than
# ! reporting a clear that did not happen.
clear_unsupported = "This app does not let me delete messages from your phone, so I could not remove this conversation. You can delete it yourself: press and hold this chat in your chat list, then choose Delete."

