# =====================================================================
[commands]
# =====================================================================
help = """I tell you which government schemes may be yours.

/start — start, or start again
/language — हिंदी or English
/schemes — the schemes I check, and their sources
/privacy — what I keep, and what I never ask
/about — what this is, and isn't
/clear — delete this chat's messages
/clearall — delete everything from the last 48 hours
/cancel — stop and forget this session

Tap the buttons to answer. You can also type your age or state."""
about = """Yojana Sathi is a free, open-source helper for unorganised workers.

It is NOT a government service or an agent. It never submits an application for you and never asks for money.

The same information is on myScheme.gov.in, as a web form. Here it is a conversation that ends in a list you can carry to a centre.

Fixed rules from official government pages decide eligibility — not an AI. Where a rule is not checked, it says so."""
privacy = """Never asked: your name, phone number or Aadhaar. There is no place to store them.

Kept: counts only — state, an age band (like 26–40), kind of work, income band. Never your exact age, income or village.

Your answers stay in memory only while we talk. Each session gets a random number, not linked to your account, so two visits can't be joined.

Your sheet is sent to you, never saved by us."""
schemes_header = "The schemes I check, each with its official source:"
schemes_line = """• {name} ({code})
   Source: {url}
   Rules checked on: {verified_on}"""
schemes_unverified = "   ⚠ Not yet checked against an official source — I will say “I don't know” for this one."
cancelled = "Stopped. Nothing saved. Send /start to begin again."
# ! Telegram only lets a bot delete messages under 48 hours old. Say so.
cleared = "Messages deleted from this chat: {count}. Send /clearall for older ones."
cleared_all = "Deleted all I could from the last 48 hours. Telegram won't let a bot delete older messages — you can remove those yourself."
clear_nothing = "There was nothing to delete."
# ! Not every channel lets a bot delete its own messages — the WhatsApp
# ! Cloud API has no delete endpoint at all. Say that plainly rather than
# ! reporting a clear that did not happen.
clear_unsupported = "This app doesn't let me delete messages. To remove this chat, press and hold it in your chat list, then tap Delete."

