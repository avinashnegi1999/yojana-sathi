# =====================================================================
[confirm]
# =====================================================================
occupation = """You said “{said}”.
Save it as “{label}”?"""
rejected = "OK. Pick from the list."
tax = """Income: {income}
Income tax: Yes
Keep both?"""
keep_both = "Keep both"
# * Two answers that cannot both be right as meant (29 Sep audit). Shown side
# * by side; only her own tap changes an earlier answer, as with tax above.
worker = """Two of your answers do not fit together.
You said you do not do unorganised work, but also that you run your own shop, business or trade.
Working for yourself usually counts as unorganised work when no PF or ESIC is cut.
Which is right?"""
worker_yes = "My work is unorganised"
keep_answers = "Keep my answers"
bank_one = """Two of your answers do not fit together.
You said you do not have a bank account, but you ticked: {names}.
This comes with a bank account. Which is right?"""
bank_many = """Two of your answers do not fit together.
You said you do not have a bank account, but you ticked: {names}.
These come with a bank account. Which is right?"""
bank_yes = "I have a bank account"
untick = "Remove the ticks"
change_income = "Change income"
change_tax = "Change tax"

# =====================================================================
[result]
# =====================================================================
evaluating = "One moment, I am checking…"
eligible_header = "{count} schemes for you"
eligible_header_one = "1 scheme for you"
# ! One sentence of benefit and the place to go. The full description and the
# ! "why you qualify" are on the sheet; on a phone, four schemes at a paragraph
# ! each buried the next button under 600 words.
scheme_line = """{index}. {name_hi} {new_badge}
   {benefit}
   Where to go: {where}"""
new_badge = "· New for you"
# ! Not "you could get this in a year". PM-SYM and NPS-Traders pay nothing
# ! until 60, so that line told a 25-year-old ₹36,000 was a year away. The
# ! total is still stated, with the start age pointed at every time.
value_line = "Pensions together: about ₹{total} a year. Each starts at the age on its line."
# * What the worker pays, under the scheme it belongs to. From premium_inr,
# * which data/schemes/_TEMPLATE.toml defines as ₹/year the WORKER pays.
premium_line = "   You pay: {premium}"
premium_per_year = "₹{amount} a year"
# * Used when the scheme's premium is written only in the other language.
premium_ask = "a regular amount — ask the centre for it"
cover_line = "Insurance cover: up to ₹{total} in total, each policy on its own terms."
value_caveat = "Not paid yet — you have to apply."
# ! On every result (council audit, 1 Oct): the sheet said so, the chat did not.
not_government = "Yojana Sathi is not a government service. The department makes the final decision."

unknown_header_one = """1 scheme I can't be sure about.
I won't guess — ask at the centre."""
unknown_header = """{count} schemes I can't be sure about.
I won't guess — ask at the centre."""
unknown_line = """• {name_hi} — {gap}
   Ask at the centre: “Am I eligible for {name_hi}?”"""
unknown_reason_data = "its rules are not yet checked against an official source"
# ! A researched-but-unsigned scheme is NOT an unresearched one. Saying "nobody
# ! looked it up" when one person did, and is waiting on a second, understates
# ! what is known and reads to a tester as a broken bot.
unknown_reason_unsigned = "its rules are written, but a person has not confirmed them yet"
unknown_reason_profile = "no answer on {fields}"
# * When the gender answer is the gap. "No answer on woman applicant" was
# * wrong for someone who answered "Other gender / prefer not to say".
unknown_reason_gender = "we are not sure it applies to you"
# ! When every unsure scheme is unsure for the SAME reason, that reason is
# ! said once. Repeating a 27-word sentence per scheme buries the one thing
# ! the worker has to act on — the question to ask at the centre.
unknown_shared = "For all of them: {gap}."
unknown_ask_all = "At the centre, ask about each one: “Am I eligible?”"
unknown_name_only = "• {name_hi}"
# ! Still used when the schemes are unsure for DIFFERENT reasons.
unknown_line_bare = "• {name_hi} — ask: “Am I eligible for {name_hi}?”"

ineligible_header = "Not for you right now"
ineligible_line = "• {name_hi} — {reason}"
# * When something matched: names only on screen, the reasons go on the sheet.
ineligible_brief = "Not for you now: {names}. Reasons are on your sheet."
ineligible_count = "{count} other schemes are not for you now. Names and reasons are on your sheet."

# ! Only for a real no. When every scheme came back UNKNOWN the worker did
# ! not fail anything - we did not check - so the next line is used instead.
no_match_header = "No scheme fits right now — but this isn't the end."
nothing_checked_header = """I couldn't check any scheme yet — that's my gap, not yours.
I can still make you a sheet for the centre."""
near_miss = "Closest: {name_hi} — {reason}"
no_match_footer = "Still, ask once at your nearest centre — states have their own schemes."

