# =====================================================================
# Every user-facing string, in English
# =====================================================================
# ! This file must contain EVERY key that data/strings_hi.toml contains.
# ! sathi/core/content.py asserts that, because a half-translated screen is
# ! worse than either language on its own. A key missing here silently falls
# ! back to Hindi at runtime, and the test is what stops that shipping.
#
# ! Same rule as the Hindi file: nothing here may state a threshold, a ₹ amount
# ! or a verdict. Those live in data/schemes/*.toml with a source_url.
#
# * English is here for two real readers: younger workers who read English
# * faster than Devanagari, and the CSC operator or NGO volunteer running this
# * on someone else's behalf. Hindi remains the default.

# =====================================================================
[language]
# =====================================================================
ask = """नमस्ते / Hello
अपनी भाषा चुनें · Choose your language"""
hindi = "हिंदी"
english = "English"
changed = "Language set to English."

# =====================================================================
[consent]
# =====================================================================
ask = """Hi, I'm Yojana Sathi.
A few quick questions, and I'll show which government schemes may be yours.
I never ask for your name, phone or Aadhaar. Only anonymous counts are kept.
This is not a government service. The department makes the final decision.
Shall we start?"""
yes = "Start"
no = "Not now"
declined = "No problem. Nothing was saved. Send /start any time."

[scheme_picker]
mode = "Check all schemes, or pick a few?"
choose = "Pick the schemes to check, then tap Done."
all = "All schemes"
done = "Done"

# =====================================================================
pick_some = "Pick a few"
# * Asked after the state (since 27 Sep 2026), so the choice can be split.
mode_scope = "Which schemes should I check?"
none_for_state = "No {state} schemes are checked yet. Here are the national schemes."
both = "Both"
national = "National schemes"
state_only = "{state} schemes"
all_of_these = "All of these"
pick_one = "Pick at least one scheme, or tap All of these."

[questions]
# * Examples added 29 Sep: a shopkeeper who read "unorganised" as "labourer"
# * answered No, then Yes to "do you run a shop". e-Shram counts self-employed
# * work (eshram.toml), so the question now says what self-employed means.
is_unorganised_worker = "Do you do unorganised work — home-based, self-employed (like your own small shop, stall or trade) or daily wage?"
# =====================================================================
state = "Which state do you live in?"
state_retry = "I didn't recognise that state. Pick one below."
age = "How old are you?"
age_retry = "Please type your age as a number, like 34."
age_out_of_range = "Please give an age from {low} to {high}. The schemes here start at age {low}."
occupation = "What work do you do?"
occupation_free = "Tell me your work in a few words."
# * Whose and when (council audit): her own earnings, in a usual month.
income_band = "In a usual month, about how much do you yourself earn?"
land_holding_band = "How much land do you have?"
family_size = "How many people live in your home?"
has_bank_account = "Do you have a bank account?"
is_income_tax_payer = "Do you pay income tax?"
is_epfo_or_esic_member = "Is PF (EPFO) or ESIC cut from your pay?"
nps_exclusion_applies = "Do you have an NPS pension account?"
# * Honest about what it decides (council audit): it is not only for skipping
