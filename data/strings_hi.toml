# ! /about must keep saying, in plain words, that this is not a government
# ! service. A worker who believes a bot is the sarkar will trust a wrong
# ! answer more than they should.
help = """मैं बताता हूँ कि सरकार की कौन सी योजनाएँ आपको मिल सकती हैं।

/start — शुरू करें, या फिर से शुरू करें
/language — हिंदी और English के बीच बदलें
/schemes — मैं कौन सी योजनाएँ देखता हूँ, और उनके नियम कहाँ से लिए हैं
/privacy — मैं क्या रखता हूँ, और क्या कभी नहीं पूछता
/about — यह क्या है, और क्या नहीं है
/clear — इस बातचीत के संदेश मिटाएँ
/clearall — पिछले 48 घंटे के सारे संदेश मिटाएँ
/cancel — रोकें और यह सत्र भूल जाएँ

जवाब बटन दबाकर दें। उम्र और राज्य लिखकर भी बता सकते हैं।"""
about = """योजना साथी असंगठित क्षेत्र के मज़दूरों के लिए एक मुफ़्त, ओपन-सोर्स मददगार है।

यह सरकारी सेवा नहीं है और न ही कोई एजेंट। यह आपकी ओर से कोई आवेदन जमा नहीं करता और कभी पैसे नहीं माँगता।

यह जानकारी सरकार पहले से myScheme.gov.in पर देती है — पर वह अंग्रेज़ी का वेब फ़ॉर्म है, जो मान लेता है कि आप पढ़ सकते हैं और 'हेक्टेयर में ज़मीन' का मतलब जानते हैं। यहाँ वही जानकारी बातचीत की तरह मिलती है, और अंत में एक सूची मिलती है जिसे आप केंद्र पर ले जा सकते हैं।

यहाँ पात्रता तय होती है सरकारी पन्नों से लिए गए पक्के नियमों से — किसी AI के अंदाज़े से नहीं। जो नियम हमने जाँचे नहीं हैं, उनके बारे में हम साफ़ कह देते हैं कि पता नहीं।"""
privacy = """मैं कभी नहीं पूछता: आपका नाम, फ़ोन नंबर, आधार नंबर। इस पूरे सिस्टम में ये खाने बने ही नहीं हैं, इसलिए ग़लती से भी सहेजे नहीं जा सकते।

क्या रखा जाता है: सिर्फ़ गिनती — राज्य, उम्र का दायरा (जैसे 26-40), काम का प्रकार, और कमाई का दायरा। न ठीक उम्र, न ठीक कमाई, न गाँव।

आपके जवाब सिर्फ़ बातचीत के दौरान याद रहते हैं और सत्र ख़त्म होते ही मिट जाते हैं। हर सत्र को एक बेतरतीब नंबर मिलता है जो आपके टेलीग्राम खाते से जुड़ा नहीं होता — इसलिए आपकी दो बातचीतें आपस में जोड़ी नहीं जा सकतीं।

जो काग़ज़ मैं बनाता हूँ वह आपको भेजा जाता है, हमारे पास कभी सहेजा नहीं जाता।"""
