# =====================================================================
# Every user-facing string, in one file, to be read aloud before release
# =====================================================================
# ! RELEASE GATE: a native speaker reads every line here out loud before this
# ! is put in front of a worker. Drafted Hindi is not reviewed Hindi — assume
# ! it is wrong until someone has said each line to a person and fixed what
# ! sounded off.
#
# ! Nothing in this file may state a threshold, a ₹ amount or a verdict. Those
# ! come from data/schemes/*.toml, authored with a source_url. A scheme fact
# ! that appears here would be a fact with no citation — the exact failure this
# ! project is built to avoid.
#
# * Placeholders in {braces} are filled by sathi/render/templates.py. Keep them
# * spelled exactly as they are or the render raises at startup, not at runtime
# * in front of a worker.
# * \n is a real line break. Keep sentences short — many users hear this as
# * audio, not text.

# =====================================================================
[language]
# =====================================================================
# * Asked before anything else, and in both languages, because a worker who
# * cannot read the question cannot answer it.
ask = """नमस्ते / Hello 🙏
अपनी भाषा चुनें — Choose your language"""
hindi = "हिंदी"
english = "English"
changed = "भाषा हिंदी कर दी गई है।"

# =====================================================================
[consent]
# =====================================================================
ask = """नमस्ते! मैं योजना साथी हूँ।
