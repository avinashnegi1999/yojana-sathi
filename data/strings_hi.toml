जवाब बटन दबाकर दें। उम्र और राज्य लिखकर भी बता सकते हैं।"""
about = """योजना साथी असंगठित क्षेत्र के मज़दूरों के लिए एक मुफ़्त, ओपन-सोर्स मददगार है।

यह सरकारी सेवा नहीं है और न ही कोई एजेंट। यह आपकी ओर से कोई आवेदन जमा नहीं करता और कभी पैसे नहीं माँगता।

यह जानकारी सरकार पहले से myScheme.gov.in पर देती है — पर वह एक वेब फ़ॉर्म है, जो मान लेता है कि आप पढ़ सकते हैं, ब्राउज़र चला सकते हैं और 'हेक्टेयर में ज़मीन' का मतलब जानते हैं। यहाँ वही जानकारी बातचीत की तरह मिलती है, और अंत में एक सूची मिलती है जिसे आप केंद्र पर ले जा सकते हैं।

यहाँ पात्रता तय होती है सरकारी पन्नों से लिए गए पक्के नियमों से — किसी AI के अंदाज़े से नहीं। जो नियम हमने जाँचे नहीं हैं, उनके बारे में हम साफ़ कह देते हैं कि पता नहीं।"""
privacy = """मैं कभी नहीं पूछता: आपका नाम, फ़ोन नंबर, आधार नंबर। इस पूरे सिस्टम में ये खाने बने ही नहीं हैं, इसलिए ग़लती से भी सहेजे नहीं जा सकते।

क्या रखा जाता है: सिर्फ़ गिनती — राज्य, उम्र का दायरा (जैसे 26-40), काम का प्रकार, और कमाई का दायरा। न ठीक उम्र, न ठीक कमाई, न गाँव।

आपके जवाब सिर्फ़ बातचीत के दौरान याद रहते हैं और सत्र ख़त्म होते ही मिट जाते हैं। हर सत्र को एक बेतरतीब नंबर मिलता है जो इस ऐप पर आपके खाते से जुड़ा नहीं होता — इसलिए आपकी दो बातचीतें आपस में जोड़ी नहीं जा सकतीं।

