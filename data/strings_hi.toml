आपका नाम, फ़ोन नंबर या आधार नंबर मैं नहीं पूछूँगा और न ही रखूँगा।
सिर्फ़ गिनती के लिए यह रखा जाता है कि किस राज्य से, किस काम के लोग आए — नाम कभी नहीं।

क्या हम शुरू करें?"""
yes = "हाँ, शुरू करें"
