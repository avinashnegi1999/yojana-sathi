[benefit]
annual_value_inr = 24000
value_basis = "annual_payout"
exclusive_group = "uk_state_pension"
premium_inr = 0
summary_en = "A monthly pension of ₹2,000 in Sikkim for people aged 18 and above with a disability certificate of more than 80%, in a BPL household with an Antyodaya or Priority Household ration card. You get one pension, not two. Register on Sikkim's online pension portal."
summary_hi = "सिक्किम में अंत्योदय या प्राथमिकता परिवार राशन कार्ड वाले बीपीएल परिवार के 18 साल या उससे ऊपर के उन लोगों के लिए ₹2,000 हर महीने की पेंशन जिनका दिव्यांगता प्रमाणपत्र 80% से अधिक है। पेंशन एक ही मिलती है, दो नहीं। सिक्किम के ऑनलाइन पेंशन पोर्टल पर पंजीकरण करें।"

