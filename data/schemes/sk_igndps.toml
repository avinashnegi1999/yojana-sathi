# docs/audit-evidence/sk-pension-schemes-2026-09-27.pdf. Drafted the same day;
# the checklist below is what was checked.
#
# * What this is: the national disability pension (IGNDPS) at Sikkim's
# * amount. The national file (igndps.toml) carries only the central share,
# * ₹300 a month (₹500 from 80); Sikkim's page gives ₹2,000 a month, "Central
# * and State Share". Both files share exclusive_group "uk_state_pension", so
# * they are never added: the group keeps the larger, which is this one.
#
# ! Source: pension registration portal, Government of Sikkim, read
# ! 2026-09-27: https://pensionscheme.sikkim.gov.in/
# ! Research note with every quote: docs/research/states/SK.md, row 3.
# ! Evidence copy (printed 2026-09-27, 3 pages) — the same PDF as SK_IGNOAPS:
# ! docs/audit-evidence/sk-pension-schemes-2026-09-27.pdf
#
# Before signing, open the page and find:
#   1. "Eligibility Criterias" (page 1), four conditions for every scheme:
#      SSC/COI/Residential Certificate; BPL household with an Antyodaya or
#      Priority Household ration card; Aadhaar; a Jan Dhan bank account.
#   2. Disability card (page 2, middle of the second row): "Should Have
#      Attained the age of 18 years." "Disability Certificate issued by the
#      Medical Authorities constituted for the purpose certifying more than
#      80% disabilities and Identity Card."
#   3. "Incentives/Financial Assistance" table (page 2), IGNDPS row:
#      "Rs. 2000/- per month. The above amount consists of Central and State
#      Share." = 24,000 a year.
#
# ? "More than 80%", where NSAP and the app's question say "80% or more". A
# ? certificate of exactly 80% is told ELIGIBLE here; the office decides.
# ? The page's wording is probably loose — confirm, and if it is strict, the
# ? question needs a new band, not a change to this file.
# ? No higher rate from 80 is listed, so there is no age band. The national
# ? ₹500 at 80 (₹6,000 a year) is below ₹24,000, so the group still keeps this.
# ? "Identity Card" is copied as written; the page does not say which one.
# ? The card is matched to the scheme by content; the cards are unlabelled.
# ? `is_bpl` stands in for "AAY or Priority Household ration card", as in
# ? SK_IGNOAPS. Hindi text below is machine-drafted; it joins the Hindi review.
