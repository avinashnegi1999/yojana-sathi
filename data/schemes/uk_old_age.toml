# Source-researched 8 September 2026, signed by a human 9 September 2026.
# Benefit reference: https://budget.uk.gov.in/files/Budget_Speech__1.pdf paragraph 189.
# ! 2026-09-09: myScheme (https://www.myscheme.gov.in/schemes/oap) independently
# ! states the same Rs 1,500/month. Where the two sources DISAGREE, this file
# ! follows the department, and both disagreements are resolved in the worker's
# ! favour rather than against her:
# !   - myScheme adds "The applicant must not be receiving any other pension";
# !     the department's own page omits it. NOT encoded as a criterion — an
# !     unsourced bar would refuse a real applicant. It survives as advice in
# !     the summary, so she is told to ask rather than turned away.
# !   - myScheme says FAMILY monthly income; the department says the
# !     APPLICANT's. The question asks the department's reading, and the fail
# !     text says the sources differ so someone near the line still goes and
# !     asks.
# ! Still worth confirming at the office when the chance arises: the income
# ! scope, the pension bar, and whether a newer government order has changed
# ! the rate. None of these blocks a verdict today — where a source is silent
# ! the file stays silent too, rather than inventing a refusal.
code = "UK_OLD_AGE"
name_en = "Uttarakhand old-age pension"
name_hi = "उत्तराखंड वृद्धावस्था पेंशन"
authority = "Government of Uttarakhand"
official_url = "https://socialwelfare.uk.gov.in/service/old-age-pension/"
verified_on = "2026-09-09"
verified_by = "Avinash Negi, checked 2026-09-09"

[benefit]
annual_value_inr = 18000
value_basis = "annual_payout"
# ! One state social pension, two routes. A widow aged 60+ satisfies both
# ! files, but Uttarakhand pays one pension, so the ₹ total counts the
# ! larger of the two once. Confirm the department's actual rule on
# ! holding both before either file is signed.
exclusive_group = "uk_state_pension"
premium_inr = 0
summary_en = "₹1,500 monthly pension after approval. If you already draw another pension, ask the office whether it affects this application — the national scheme portal says it does, the department's own page does not mention it. Apply through ssp.uk.gov.in or assisted services. Eligibility and documents are checked by the department. Do not add multiple pension routes together as guaranteed payments."
summary_hi = "स्वीकृति के बाद ₹1,500 मासिक पेंशन। यदि आपको पहले से कोई और पेंशन मिल रही है तो कार्यालय में पूछें कि इस आवेदन पर उसका असर है या नहीं — राष्ट्रीय पोर्टल कहता है कि असर है, विभाग के अपने पृष्ठ पर इसका ज़िक्र नहीं है। ssp.uk.gov.in या सहायता केंद्र से आवेदन करें। विभाग पात्रता और दस्तावेज़ जाँचता है। अलग-अलग पेंशन विकल्पों को जोड़कर निश्चित भुगतान न मानें।"

[[criteria]]
field = "state"
op = "eq"
value = "UK"
ask_en = "Which state do you live in?"
ask_hi = "आप किस राज्य में रहते हैं?"
pass_en = "You reported living in Uttarakhand; residence documents are checked during application."
pass_hi = "आपने उत्तराखंड में रहना बताया है; आवेदन में निवास के दस्तावेज़ जाँचे जाएँगे।"
fail_en = "This is a Uttarakhand state pension; ask about the scheme in your own state."
fail_hi = "यह उत्तराखंड की पेंशन है; अपने राज्य की योजना के बारे में पूछें।"
source_url = "https://socialwelfare.uk.gov.in/service/old-age-pension/"

[[criteria]]
field = "age"
op = "gte"
value = 60
ask_en = "How old are you?"
ask_hi = "आपकी उम्र कितनी है?"
pass_en = "Your reported age meets the entry-age condition."
pass_hi = "आपकी बताई उम्र प्रवेश की आयु-शर्त पूरी करती है।"
fail_en = "Your reported age is outside the entry-age range."
fail_hi = "आपकी बताई उम्र प्रवेश की आयु-सीमा में नहीं है।"
source_url = "https://socialwelfare.uk.gov.in/service/old-age-pension/"

[[criteria]]
field = "uk_pension_income_or_bpl"
op = "eq"
value = true
# ! The department page: "The monthly income of the applicant should not exceed
# ! Rs. 4000/- from all sources or the applicant should be a BPL card holder."
# ! myScheme says FAMILY income instead. We follow the department here, because
# ! it is the authority for its own scheme and the family reading is stricter -
# ! it would refuse an applicant earning Rs 2,000 in a household earning Rs 4,500,
# ! and a wrong refusal is a pension nobody claims.
ask_en = "For the state pension: is YOUR OWN monthly income, from all sources, ₹4,000 or less — or do you hold a BPL card? If unsure, choose Don't know."
ask_hi = "राज्य पेंशन के लिए: क्या सभी स्रोतों से आपकी अपनी मासिक आय ₹4,000 या कम है, अथवा आपके पास बीपीएल कार्ड है? पक्का न हो तो पता नहीं चुनें।"
pass_en = "You reported meeting the income-or-BPL condition; the authority checks the certificate."
pass_hi = "आपने आय अथवा बीपीएल शर्त पूरी होना बताया है; अधिकारी प्रमाणपत्र जाँचेंगे।"
fail_en = "The stated income-or-BPL condition is not met. The national portal words this as family income rather than yours alone, so ask at the office if you are near the line."
fail_hi = "बताई गई आय अथवा बीपीएल शर्त पूरी नहीं होती। राष्ट्रीय पोर्टल इसे परिवार की आय बताता है, केवल आपकी नहीं — सीमा के आसपास हों तो कार्यालय में पूछें।"
source_url = "https://socialwelfare.uk.gov.in/service/old-age-pension/"

[[criteria]]
field = "uk_pension_selected"
op = "eq"
value = true
ask_en = "Have you already been selected for the pension through the local Gram Sabha/Gram Panchayat or councillor process? If not, the local office can explain this application step."
ask_hi = "क्या ग्राम सभा/ग्राम पंचायत या सभासद की स्थानीय प्रक्रिया से पेंशन के लिए आपका चयन हो चुका है? नहीं हुआ तो स्थानीय कार्यालय से इस आवेदन चरण की जानकारी लें।"
pass_en = "You reported local selection; the application needs the selection proposal."
pass_hi = "आपने स्थानीय चयन बताया है; आवेदन में चयन प्रस्ताव चाहिए।"
fail_en = "Local selection is still needed. Ask the Gram Panchayat/councillor about completing this step; this is not a permanent refusal."
fail_hi = "स्थानीय चयन अभी बाकी है। यह चरण पूरा करने के लिए ग्राम पंचायत/सभासद से पूछें; यह स्थायी अस्वीकृति नहीं है।"
source_url = "https://socialwelfare.uk.gov.in/service/old-age-pension/"

[paperwork]
documents_en = ["Aadhaar card", "Bank passbook", "Income certificate or BPL card", "Family register (rural) or ration card (urban)", "Local selection proposal", "Attested photograph"]
documents = ["आधार कार्ड", "बैंक पासबुक", "आय प्रमाणपत्र या बीपीएल कार्ड", "परिवार रजिस्टर (ग्रामीण) या राशन कार्ड (शहरी)", "स्थानीय चयन प्रस्ताव", "प्रमाणित फोटो"]
where_to_apply = "online"
renewal_en = "Follow the department's current verification instructions; report changes in eligibility. Confirm whether any existing pension affects your application."
renewal = "विभाग के वर्तमान सत्यापन निर्देश मानें; पात्रता बदलने की सूचना दें। पहले से मिल रही पेंशन का आवेदन पर असर विभाग से पूछें।"
