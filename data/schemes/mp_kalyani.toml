# SIGNED 27 September 2026 by Avinash Negi (see verified_by). Drafted the
# same day; the checklist below is what was checked.
#
# * What this is: Madhya Pradesh's own widow pension, Mukhyamantri Kalyani
# * Pension ("Kalyani" is the state's word for a widow). ₹600 a month, paid
# * wholly by the state, for widows aged 18–79. BPL is explicitly NOT needed.
# * It sits in exclusive_group "uk_state_pension" with the national widow
# * pension: the page bars anyone "receiving any other pension scheme
# * benefits", so she gets one or the other, never both added.
#
# ! Source: District Dhar, Government of Madhya Pradesh (NIC-hosted district
# ! site), scheme page, last updated 16 Sep 2026, read 2026-09-27:
# ! https://dhar.nic.in/en/scheme/chief-minister-kalyani-pension-scheme/
# ! A DISTRICT page, not the state department's. The state portal
# ! (socialsecurity.mp.gov.in) was not readable. Prefer a state order.
# ! Research note: docs/research/states/MP.md, row 3.
# ! Evidence copy (printed 2026-09-27, 3 pages):
# ! docs/audit-evidence/mp-kalyani-dhar-2026-09-27.pdf
#
# Before signing, open the page and find (table, page 1–2):
#   1. "Plan Commencement Date 1 April 2018".
#   2. Beneficiary: "1. Age of Kalyani (widow) between 18 to 79 years.
#      2. Beneficiary should not be income tax payer. 3. Not a government
#      employee / officer 4. Kalyani is not receiving family pension
#      5. Not required BPL. 6. Kalyani is not receiving any other pension
#      scheme benefits"
#   3. Benefits: "600 / – Per month by the state government to Kalyani
#      (widow) of 18 years and 79 years." = 7,200 a year.
#   4. Documents 1–13, and "submitted to the District Panchayat in the rural
#      area and the Municipality / Municipal Council in the urban area ... or
#      ... by applying in the Public Service Guarantee." (page 3)
#
# ? Condition 3, "Not a government employee / officer", is NOT encoded. The
# ? only related field, has_government_service_in_family, also covers an
# ? unmarried child, which would wrongly refuse her. A widow who is herself a
# ? government employee is told ELIGIBLE here; the declaration form (document
# ? 10) catches it at the office. Adding a self-only question is a product call.
# ? Condition 4 (family pension) is folded into receives_other_pension —
# ? a family pension is a pension, and the question asks about "any other".
# ? where_to_apply is "local_office" (added 2026-09-27): the page names the
# ? District Panchayat (rural) or Municipality (urban). The Public Service
# ? Guarantee (Lok Seva) route it also names is in the summary, not a location.
# ? No age-80 rule is given; the pension simply ends at 79 on this page.
# ? Hindi text below is machine-drafted; it joins the Hindi review.
