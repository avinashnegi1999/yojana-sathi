# Source-researched draft, 12 September 2026. NO HUMAN SIGN-OFF IS CLAIMED.
# ! nsap.nic.in refused every connection on 12 September 2026, so the values
# ! below were read from the myScheme entry, which reproduces the NSAP FAQ
# ! text. That is an aggregator, and this project has been burned by one
# ! before (uk_widow.toml). Before signing: open nsap.nic.in/circular.do?method=faq
# ! yourself and confirm every figure against the ministry's own page.
# !
# ! THE ₹ FIGURE IS THE CENTRAL SHARE, NOT WHAT SHE RECEIVES. States top this
# ! up - myScheme's own text: "beneficiaries are getting anywhere between
# ! ₹200/- to ₹1000/- depending on the State Contribution". Where a state
# ! pension file exists (UK_OLD_AGE) it carries the real figure, and
# ! this file sits in the same exclusive_group so the two are never added: the
# ! group keeps the larger, which is the state figure. This file exists so a
# ! worker in a state with no file yet is still told the pension exists.
code = "IGNOAPS"
name_en = "Indira Gandhi National Old Age Pension"
name_hi = "इंदिरा गांधी राष्ट्रीय वृद्धावस्था पेंशन"
authority = "Ministry of Rural Development (NSAP)"
official_url = "https://nsap.nic.in/"
verified_on = "2026-09-15"
verified_by = "Avinash Negi, checked 2026-09-15"

[benefit]
annual_value_inr = 2400
annual_value_age_bands = [{ min_age = 80, annual_value_inr = 6000 }]
value_basis = "annual_payout"
exclusive_group = "uk_state_pension"
premium_inr = 0
summary_en = "A monthly pension from the central government for people aged 60 and above in a BPL household: ₹200 a month up to age 79, ₹500 a month from 80. Most states add their own amount on top — what you actually receive is usually more, and your state's own pension scheme (if listed here) shows the fuller figure. You get one pension, not both. Apply through the UMANG app or at the panchayat or municipal office."
summary_hi = "बीपीएल परिवार के 60 साल या उससे ऊपर के लोगों के लिए केंद्र सरकार की मासिक पेंशन: 79 साल तक ₹200 हर महीने, 80 से ₹500। ज़्यादातर राज्य इसके ऊपर अपनी रकम जोड़ते हैं — असल में मिलने वाली रकम आमतौर पर इससे ज़्यादा होती है, और आपके राज्य की अपनी पेंशन योजना (अगर यहाँ सूची में है) पूरी रकम दिखाती है। पेंशन एक ही मिलती है, दोनों नहीं। UMANG ऐप से या पंचायत/नगरपालिका कार्यालय में आवेदन करें।"

[[criteria]]
field = "age"
op = "gte"
value = 60
ask_en = "How old are you?"
ask_hi = "आपकी उम्र कितनी है?"
pass_en = "Your reported age meets the entry-age condition."
pass_hi = "आपकी बताई उम्र प्रवेश की आयु-शर्त पूरी करती है।"
fail_en = "This pension starts at age 60."
fail_hi = "यह पेंशन 60 साल की उम्र से शुरू होती है।"
source_url = "https://www.myscheme.gov.in/schemes/nsap-ignoaps"

[[criteria]]
field = "is_bpl"
op = "eq"
value = true
ask_en = "Does your household have a BPL card, or is it listed as Below Poverty Line?"
ask_hi = "क्या आपके परिवार के पास बीपीएल कार्ड है, या परिवार ग़रीबी रेखा से नीचे सूचीबद्ध है?"
pass_en = "You reported a BPL household; the office checks the list."
pass_hi = "आपने बीपीएल परिवार बताया; कार्यालय सूची जाँचेगा।"
fail_en = "This scheme is for households on the BPL list. If you are unsure whether yours is listed, ask at the panchayat or municipal office — do not assume no."
fail_hi = "यह योजना बीपीएल सूची वाले परिवारों के लिए है। अगर पक्का नहीं है कि आपका परिवार सूची में है, तो पंचायत या नगरपालिका कार्यालय में पूछें — न मान लें।"
source_url = "https://www.myscheme.gov.in/schemes/nsap-ignoaps"

[paperwork]
documents_en = ["Aadhaar card", "BPL card or BPL list extract", "Age proof", "Bank or post office passbook", "Photograph"]
documents = ["आधार कार्ड", "बीपीएल कार्ड या बीपीएल सूची की प्रति", "उम्र का प्रमाण", "बैंक या डाकघर पासबुक", "फोटो"]
where_to_apply = "csc"
renewal_en = "Paid directly to your bank or post office account. Report a change of address. The amount rises automatically at 80."
renewal = "सीधे आपके बैंक या डाकघर खाते में आती है। पता बदलने पर सूचना दें। 80 साल पर रकम अपने आप बढ़ती है।"
