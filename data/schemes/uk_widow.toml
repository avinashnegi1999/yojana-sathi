# RE-SIGNED 27 September 2026 by Avinash Negi (see verified_by), against the
# two primary sources below. The rate no longer rests on myScheme.
#
# ! Question (a), the rate, is answered by the state's own order:
# !   Government Order 40/XVII-2/22-19(05)2019TC, Social Welfare Section-2,
# !   Government of Uttarakhand, 21 April 2022 (Principal Secretary L. Fanai):
# !   old-age, "निराश्रित विधवा भरण पोषण अनुदान" (destitute widow maintenance
# !   grant — this pension) and disability pension rates raised by ₹100 to
# !   "₹1500/- प्रतिमाह", with immediate effect; para 3: the raised rates
# !   include the central share.
# !   Copy: docs/audit-evidence/uk-go40-pension-rates-2022-04-21.pdf
# !   https://cdnbbsr.s3waas.gov.in/s357bafb2c2dfeefba931bb03a835b1fa9/uploads/2025/02/202502041827311603.pdf
# ! Question (b), the other-pension bar, and the rate AGAIN, from the
# ! department's Hindi pension overview (read 2026-09-27), widow section:
# !   "उन विधवाओं को हर महीने ₹1,500/- की पेंशन दी जाती है जिनकी पारिवारिक
# !    आय ₹4,000/- प्रति माह से ज़्यादा नहीं है या जो बी० पी० एल० कैटेगरी की
# !    हैं, और जिन्हें कोई दूसरी पेंशन का फायदा नहीं मिल रहा है।"
# !   Copy: docs/audit-evidence/uk-pension-overview-hi-2026-09-27.html
# ! The test oracle (tests/test_rule_boundaries.py) now encodes that exclusion
# ! from the overview's own words, so the sweep checks it once signed.
# ? GO 40 is from 2022. No later order was found raising it, and the overview
# ? (live 2026-09-27) still says ₹1,500 — but confirm no newer GO exists.
# ? The myScheme citation in the history below is superseded; the
# ? source_url fields still point at the department's pages, which is right.
#
# * History, kept as written:
# Source-researched draft, 8 September 2026. No human sign-off is claimed.
# ! BENEFIT AMOUNT: withdrawn on 2026-09-09, then RESTORED the same day from a
# ! different official source. The original citation
# ! (budget.uk.gov.in/files/Budget_Speech__1.pdf paragraph 189) now returns 404,
# ! and the department's own widow service page states no rate at all — unlike
# ! the old-age page, which states its own. The figure below now comes from
# ! myScheme, the Government of India scheme portal run by Digital India
# ! Corporation under MeitY: "A pension of Rs 1,500/- per month is provided to
# ! eligible beneficiaries" (https://www.myscheme.gov.in/schemes/uwps, read
# ! 2026-09-09). myScheme cites the state's own guidelines, page 16, at
# ! uk.gov.in/department92/library_file/file-04-12-2023-06-02-23.pdf — a 320 MB
# ! scanned file that could not be read here.
# ! 2026-09-10, checked a third time, and the case got WORSE not better:
# !   1. The HINDI version of the department's widow page also states no amount.
# !   2. myScheme's own "Official Website" link for this scheme points at
# !      socialwelfare.uk.gov.in/service/destitute-pension/ — a DIFFERENT
# !      scheme, for a destitute unmarried woman, with its own conditions. So
# !      the one page that gives Rs 1,500 cites the wrong source for it.
# !   3. The English widow page omits the other-pension bar, but the department's
# !      Hindi pension overview explicitly says a widow must not receive another
# !      pension. The exclusion below now follows that primary department source.
# !
# ! SIGNED ANYWAY, KNOWINGLY, on 2026-09-10. This is the weakest provenance of
# ! the seven files and the decision is recorded here rather than hidden:
# !   - The rate rests on myScheme alone, a Government of India portal, not on
# !     the department's own page. That is a real government source; it is not
# !     the primary one, and its own outbound link is wrong.
# ! Two questions remain open and are not closable by more reading — the reading
# ! has been done three times. They need the SSP helpline or the district social
# ! welfare office:
# !   (a) what is the current widow pension rate?
# !   (b) does an existing pension block a widow pension application?
# ! Until one of those is answered, the limitation is disclosed on the landing
# ! page ("One rate needs confirming") rather than left for a reader to find.
# ! If this scheme is ever shown to a real widow rather than a tester, make the
# ! call first. Withdrawing the figure is one edit: set annual_value_inr to
# ! "TODO" and the scheme returns UNKNOWN with "ask at the centre".
# !
# ! SIGNATURE WITHDRAWN on 2026-09-15. The other-pension bar above was changed
# ! from "ask at the office" to an exclusion on the department's Hindi overview,
# ! and a changed rule needs a fresh human audit. The file is served as UNKNOWN
# ! until question (a) is settled at a primary source and it is re-signed.
code = "UK_WIDOW"
name_en = "Uttarakhand widow pension"
name_hi = "उत्तराखंड विधवा पेंशन"
authority = "Government of Uttarakhand"
official_url = "https://socialwelfare.uk.gov.in/service/widow-pension/"
verified_on = "2026-09-27"
verified_by = "Avinash Negi, checked 2026-09-27"

[benefit]
annual_value_inr = 18000   # ! Rs 1,500/month — GO 40 of 21 Apr 2022, see header
value_basis = "annual_payout"
# ! One state social pension, two routes. A widow aged 60+ satisfies both
# ! files, but Uttarakhand pays one pension, so the ₹ total counts the
# ! larger of the two once. Confirm the department's actual rule on
# ! holding both before either file is signed.
exclusive_group = "uk_state_pension"
premium_inr = 0
summary_en = "₹1,500 monthly pension after approval, set by Uttarakhand government order of 21 April 2022. The Uttarakhand department's pension overview says this route is for widows who are not receiving another pension. Apply through ssp.uk.gov.in or assisted services. Eligibility and documents are checked by the department. Do not add multiple pension routes together as guaranteed payments."
summary_hi = "उत्तराखंड शासनादेश (21 अप्रैल 2022) के अनुसार स्वीकृति के बाद ₹1,500 मासिक पेंशन। उत्तराखंड विभाग के पेंशन विवरण के अनुसार यह विधवाओं के लिए है जिन्हें कोई दूसरी पेंशन नहीं मिल रही है। ssp.uk.gov.in या सहायता केंद्र से आवेदन करें। विभाग पात्रता और दस्तावेज़ जाँचता है। अलग-अलग पेंशन विकल्पों को जोड़कर निश्चित भुगतान न मानें।"

[[criteria]]
field = "state"
op = "eq"
value = "UK"
ask_en = "Which state do you live in?"
ask_hi = "आप किस राज्य में रहते हैं?"
pass_en = "You reported living in Uttarakhand; residence documents are checked during application."
pass_hi = "आपने उत्तराखंड में रहना बताया है; आवेदन में निवास के दस्तावेज़ जाँचे जाएँगे।"
fail_en = "This is a Uttarakhand state pension; ask about the scheme in your own state."
fail_hi = "यह उत्तराखंड की पेंशन है; अपने राज्य की योजना के बारे में पूछें।"
source_url = "https://socialwelfare.uk.gov.in/service/widow-pension/"

[[criteria]]
field = "age"
op = "gte"
value = 18
ask_en = "How old are you?"
ask_hi = "आपकी उम्र कितनी है?"
pass_en = "Your reported age meets the entry-age condition."
pass_hi = "आपकी बताई उम्र प्रवेश की आयु-शर्त पूरी करती है।"
fail_en = "Your reported age is outside the entry-age range."
fail_hi = "आपकी बताई उम्र प्रवेश की आयु-सीमा में नहीं है।"
source_url = "https://socialwelfare.uk.gov.in/service/widow-pension/"

[[criteria]]
field = "is_widow"
op = "eq"
value = true
ask_en = "Are you a widow (your husband has died)? You can choose Don't know to skip. Do not send a certificate here."
ask_hi = "क्या आप विधवा हैं (पति का निधन हो चुका है)? छोड़ने के लिए पता नहीं चुनें। यहाँ प्रमाणपत्र न भेजें।"
pass_en = "You reported widow status; a death certificate is required at application."
pass_hi = "आपने विधवा स्थिति बताई है; आवेदन में मृत्यु प्रमाणपत्र चाहिए।"
fail_en = "This pension route is for widows."
fail_hi = "यह पेंशन विधवाओं के लिए है।"
source_url = "https://socialwelfare.uk.gov.in/service/widow-pension/"

[[criteria]]
# ! 2026-09-29: this file's own field. It shared `uk_pension_income_or_bpl`
# ! with uk_old_age.toml, whose question is about the applicant's OWN income,
# ! and that wording was the one shown to a widow aged 60+. Field name only —
# ! the question, the rule and the texts below are unchanged. Re-read at the
# ! next review (`python3 -m sathi.review`).
field = "uk_widow_income_or_bpl"
op = "eq"
value = true
ask_en = "For the state pension: is your FAMILY's monthly income from all sources ₹4,000 or less, OR do you hold a BPL card? If unsure, choose Don't know."
ask_hi = "राज्य पेंशन के लिए: क्या सभी स्रोतों से आपके परिवार की मासिक आय ₹4,000 या कम है, अथवा आपके पास बीपीएल कार्ड है? पक्का न हो तो पता नहीं चुनें।"
pass_en = "You reported meeting the income-or-BPL condition; the authority checks the certificate."
pass_hi = "आपने आय अथवा बीपीएल शर्त पूरी होना बताया है; अधिकारी प्रमाणपत्र जाँचेंगे।"
fail_en = "The stated income-or-BPL condition is not met. Note the sources differ on whose income counts — the department page says the applicant's, the national portal says the family's — so ask at the office if you are near the line."
fail_hi = "बताई गई आय अथवा बीपीएल शर्त पूरी नहीं होती। ध्यान दें: किसकी आय गिनी जाए, इस पर स्रोत अलग-अलग हैं — विभाग का पृष्ठ आवेदक की आय कहता है, राष्ट्रीय पोर्टल परिवार की। सीमा के आसपास हों तो कार्यालय में पूछें।"
source_url = "https://socialwelfare.uk.gov.in/service/widow-pension/"

[[criteria]]
field = "uk_pension_selected"
op = "eq"
value = true
ask_en = "Have you already been selected for the pension through the local Gram Sabha/Gram Panchayat or councillor process? If not, the local office can explain this application step."
ask_hi = "क्या ग्राम सभा/ग्राम पंचायत या सभासद की स्थानीय प्रक्रिया से पेंशन के लिए आपका चयन हो चुका है? नहीं हुआ तो स्थानीय कार्यालय से इस आवेदन चरण की जानकारी लें।"
pass_en = "You reported local selection; the application needs the selection proposal."
pass_hi = "आपने स्थानीय चयन बताया है; आवेदन में चयन प्रस्ताव चाहिए।"
fail_en = "Local selection is still needed. Ask the Gram Panchayat/councillor about completing this step; this is not a permanent refusal."
fail_hi = "स्थानीय चयन अभी बाकी है। यह चरण पूरा करने के लिए ग्राम पंचायत/सभासद से पूछें; यह स्थायी अस्वीकृति नहीं है।"
source_url = "https://socialwelfare.uk.gov.in/service/widow-pension/"

[[exclusions]]
field = "receives_other_pension"
op = "eq"
value = true
ask_en = "Are you already receiving any other pension? If you are unsure, choose Don't know."
ask_hi = "क्या आपको पहले से कोई दूसरी पेंशन मिल रही है? पक्का न हो तो पता नहीं चुनें।"
reason_en = "You reported receiving another pension. Uttarakhand's pension overview says this widow-pension route is for widows who are not receiving another pension."
reason_hi = "आपने दूसरी पेंशन मिलना बताया है। उत्तराखंड के पेंशन विवरण के अनुसार यह विधवा पेंशन उन विधवाओं के लिए है जिन्हें कोई दूसरी पेंशन नहीं मिल रही है।"
source_url = "https://socialwelfare.uk.gov.in/hi/%E0%A4%AA%E0%A5%87%E0%A4%82%E0%A4%B6%E0%A4%A8-%E0%A4%AF%E0%A5%8B%E0%A4%9C%E0%A4%A8%E0%A4%BE%E0%A4%8F%E0%A4%82/"

[paperwork]
documents_en = ["Aadhaar card", "Bank passbook", "Income certificate or BPL card", "Family register (rural) or ration card (urban)", "Local selection proposal", "Attested photograph", "Husband's death certificate"]
documents = ["आधार कार्ड", "बैंक पासबुक", "आय प्रमाणपत्र या बीपीएल कार्ड", "परिवार रजिस्टर (ग्रामीण) या राशन कार्ड (शहरी)", "स्थानीय चयन प्रस्ताव", "प्रमाणित फोटो", "पति का मृत्यु प्रमाणपत्र"]
where_to_apply = "online"
renewal_en = "Follow the department's current verification instructions and report changes in eligibility."
renewal = "विभाग के वर्तमान सत्यापन निर्देश मानें और पात्रता बदलने की सूचना दें।"
