# Source-researched draft, 8 September 2026. No human sign-off is claimed.
# ! BENEFIT AMOUNT: withdrawn on 2026-09-09, then RESTORED the same day from a
# ! different official source. The original citation
# ! (budget.uk.gov.in/files/Budget_Speech__1.pdf paragraph 189) now returns 404,
# ! and the department's own widow service page states no rate at all — unlike
# ! the old-age page, which states its own. The figure below now comes from
# ! myScheme, the Government of India scheme portal run by Digital India
# ! Corporation under MeitY: "A pension of Rs 1,500/- per month is provided to
# ! eligible beneficiaries" (https://www.myscheme.gov.in/schemes/uwps, read
# ! 2026-09-09). myScheme cites the state's own guidelines, page 16, at
# ! uk.gov.in/department92/library_file/file-04-12-2023-06-02-23.pdf — a 320 MB
# ! scanned file that could not be read here. A human should confirm the rate
# ! against that page or the 21/04/2021 rate GO before signing this file.
# ! 2026-09-10, checked a third time, and the case got WORSE not better:
# !   1. The HINDI version of the department's widow page also states no amount.
# !   2. myScheme's own "Official Website" link for this scheme points at
# !      socialwelfare.uk.gov.in/service/destitute-pension/ — a DIFFERENT
# !      scheme, for a destitute unmarried woman, with its own conditions. So
# !      the one page that gives Rs 1,500 cites the wrong source for it.
# !   3. Nothing on the department's site mentions the "not receiving another
# !      pension" bar that this file encodes as a refusal.
# ! This is why this file stays unsigned while the other six are signed. It is
# ! not a gap more reading closes — the reading has been done three times. It
# ! needs the SSP helpline or the district social welfare office:
# !   (a) what is the current widow pension rate?
# !   (b) does an existing pension block a widow pension application?
# ! Until then the worker is told we could not check it, which is true.
# ! Pending: reconcile income scope, pension overlap and current government orders before human sign-off.
code = "UK_WIDOW"
name_en = "Uttarakhand widow pension"
name_hi = "उत्तराखंड विधवा पेंशन"
authority = "Government of Uttarakhand"
official_url = "https://socialwelfare.uk.gov.in/service/widow-pension/"
verified_on = "2026-09-10"
verified_by = "Avinash Negi, checked 2026-09-10"

[benefit]
annual_value_inr = 18000   # ! Rs 1,500/month; see the source note above
value_basis = "annual_payout"
# ! One state social pension, two routes. A widow aged 60+ satisfies both
# ! files, but Uttarakhand pays one pension, so the ₹ total counts the
# ! larger of the two once. Confirm the department's actual rule on
# ! holding both before either file is signed.
exclusive_group = "uk_state_pension"
premium_inr = 0
summary_en = "₹1,500 monthly pension after approval, per the national scheme portal. If you already draw another pension, ask the office whether it affects this application — the national portal says it does, the department's own page does not mention it. Apply through ssp.uk.gov.in or assisted services. Eligibility and documents are checked by the department. Do not add multiple pension routes together as guaranteed payments."
summary_hi = "राष्ट्रीय योजना पोर्टल के अनुसार स्वीकृति के बाद ₹1,500 मासिक पेंशन। यदि आपको पहले से कोई और पेंशन मिल रही है तो कार्यालय में पूछें कि इस आवेदन पर उसका असर है या नहीं — राष्ट्रीय पोर्टल कहता है कि असर है, विभाग के अपने पृष्ठ पर इसका ज़िक्र नहीं है। ssp.uk.gov.in या सहायता केंद्र से आवेदन करें। विभाग पात्रता और दस्तावेज़ जाँचता है। अलग-अलग पेंशन विकल्पों को जोड़कर निश्चित भुगतान न मानें।"

[[criteria]]
field = "state"
op = "eq"
value = "UK"
ask_en = "Which state do you live in?"
ask_hi = "आप किस राज्य में रहते हैं?"
pass_en = "You reported living in Uttarakhand; residence documents are checked during application."
pass_hi = "आपने उत्तराखंड में रहना बताया है; आवेदन में निवास के दस्तावेज़ जाँचे जाएँगे।"
fail_en = "This is a Uttarakhand state pension; ask about the scheme in your own state."
fail_hi = "यह उत्तराखंड की पेंशन है; अपने राज्य की योजना के बारे में पूछें।"
source_url = "https://socialwelfare.uk.gov.in/service/widow-pension/"

[[criteria]]
field = "age"
op = "gte"
value = 18
ask_en = "How old are you?"
ask_hi = "आपकी उम्र कितनी है?"
pass_en = "Your reported age meets the entry-age condition."
pass_hi = "आपकी बताई उम्र प्रवेश की आयु-शर्त पूरी करती है।"
fail_en = "Your reported age is outside the entry-age range."
fail_hi = "आपकी बताई उम्र प्रवेश की आयु-सीमा में नहीं है।"
source_url = "https://socialwelfare.uk.gov.in/service/widow-pension/"

[[criteria]]
field = "is_widow"
op = "eq"
value = true
ask_en = "Are you a widow (your husband has died)? You can choose Don't know to skip. Do not send a certificate here."
ask_hi = "क्या आप विधवा हैं (पति का निधन हो चुका है)? छोड़ने के लिए पता नहीं चुनें। यहाँ प्रमाणपत्र न भेजें।"
pass_en = "You reported widow status; a death certificate is required at application."
pass_hi = "आपने विधवा स्थिति बताई है; आवेदन में मृत्यु प्रमाणपत्र चाहिए।"
fail_en = "This pension route is for widows."
fail_hi = "यह पेंशन विधवाओं के लिए है।"
source_url = "https://socialwelfare.uk.gov.in/service/widow-pension/"

[[criteria]]
field = "uk_pension_income_or_bpl"
op = "eq"
value = true
ask_en = "For the state pension: is your FAMILY's monthly income from all sources ₹4,000 or less, OR do you hold a BPL card? If unsure, choose Don't know."
ask_hi = "राज्य पेंशन के लिए: क्या सभी स्रोतों से आपके परिवार की मासिक आय ₹4,000 या कम है, अथवा आपके पास बीपीएल कार्ड है? पक्का न हो तो पता नहीं चुनें।"
pass_en = "You reported meeting the income-or-BPL condition; the authority checks the certificate."
pass_hi = "आपने आय अथवा बीपीएल शर्त पूरी होना बताया है; अधिकारी प्रमाणपत्र जाँचेंगे।"
fail_en = "The stated income-or-BPL condition is not met. Note the sources differ on whose income counts — the department page says the applicant's, the national portal says the family's — so ask at the office if you are near the line."
fail_hi = "बताई गई आय अथवा बीपीएल शर्त पूरी नहीं होती। ध्यान दें: किसकी आय गिनी जाए, इस पर स्रोत अलग-अलग हैं — विभाग का पृष्ठ आवेदक की आय कहता है, राष्ट्रीय पोर्टल परिवार की। सीमा के आसपास हों तो कार्यालय में पूछें।"
source_url = "https://socialwelfare.uk.gov.in/service/widow-pension/"

[[criteria]]
field = "uk_pension_selected"
op = "eq"
value = true
ask_en = "Have you already been selected for the pension through the local Gram Sabha/Gram Panchayat or councillor process? If not, the local office can explain this application step."
ask_hi = "क्या ग्राम सभा/ग्राम पंचायत या सभासद की स्थानीय प्रक्रिया से पेंशन के लिए आपका चयन हो चुका है? नहीं हुआ तो स्थानीय कार्यालय से इस आवेदन चरण की जानकारी लें।"
pass_en = "You reported local selection; the application needs the selection proposal."
pass_hi = "आपने स्थानीय चयन बताया है; आवेदन में चयन प्रस्ताव चाहिए।"
fail_en = "Local selection is still needed. Ask the Gram Panchayat/councillor about completing this step; this is not a permanent refusal."
fail_hi = "स्थानीय चयन अभी बाकी है। यह चरण पूरा करने के लिए ग्राम पंचायत/सभासद से पूछें; यह स्थायी अस्वीकृति नहीं है।"
source_url = "https://socialwelfare.uk.gov.in/service/widow-pension/"

[paperwork]
documents_en = ["Aadhaar card", "Bank passbook", "Income certificate or BPL card", "Family register (rural) or ration card (urban)", "Local selection proposal", "Attested photograph", "Husband's death certificate"]
documents = ["आधार कार्ड", "बैंक पासबुक", "आय प्रमाणपत्र या बीपीएल कार्ड", "परिवार रजिस्टर (ग्रामीण) या राशन कार्ड (शहरी)", "स्थानीय चयन प्रस्ताव", "प्रमाणित फोटो", "पति का मृत्यु प्रमाणपत्र"]
where_to_apply = "online"
renewal_en = "Follow the department's current verification instructions; report changes in eligibility. Confirm whether any existing pension affects your application."
renewal = "विभाग के वर्तमान सत्यापन निर्देश मानें; पात्रता बदलने की सूचना दें। पहले से मिल रही पेंशन का आवेदन पर असर विभाग से पूछें।"
