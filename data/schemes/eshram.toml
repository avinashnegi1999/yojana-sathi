# =====================================================================
# e-Shram registration (NDUW) — scheme rules
# =====================================================================
# ! SOURCE: the official FAQ page on eshram.gov.in, Ministry of Labour &
# ! Employment. Quoted question numbers are from that page.
#
# ! TRANSCRIBED FROM THE SOURCE ON 2026-08-31 AND NOT YET CHECKED BY A SECOND
# ! PAIR OF EYES.
#
# ! THE STRUCTURAL QUESTION IS ANSWERED, AND THE ANSWER IS "GATEWAY".
# ! The FAQ describes e-Shram as "a centralised database of unorganised workers
# ! ... to facilitate delivery of various social security benefits" (Q13). It
# ! issues a UAN and a card. It states no payout of its own, so:
# !   benefit.annual_value_inr = 0
# !   benefit.value_basis      = "gateway"   ← new basis added for exactly this
# ! Linked schemes have separate eligibility and enrolment. Registration alone
# ! must not be described as automatic insurance cover.
# !
# ! Consequence for the data model: no `prerequisites` concept was added. The
# ! FAQ does not make e-Shram a precondition for PMSBY or PM-SYM — those have
# ! their own eligibility — so a prerequisite link would be an invented rule.
# ! If research later shows a state scheme that does require the UAN first,
# ! `prerequisites = ["ESHRAM"]` already exists in the loader for it.
# =====================================================================

# * IDENTITY
code         = "ESHRAM"
# * The parenthetical is what it IS, not what it is called. It appears twice in
# * one sentence on the result screen ("Am I eligible for …?"), so the long form
# * lives in summary_en instead.
name_en      = "e-Shram registration"
name_hi      = "ई-श्रम पंजीकरण"
authority    = "Ministry of Labour & Employment, Government of India"
official_url = "https://eshram.gov.in/faqs"
verified_on  = "2026-09-10"
verified_by  = "Avinash Negi, checked 2026-09-10"

# * WHAT THE WORKER GETS
[benefit]
# ! Zero is CORRECT here and is not a stub. e-Shram carries no payout of its
# ! own; it is the UAN card that other schemes are delivered through. The
# ! dashboard's ₹ total is unaffected by it, which is the honest outcome.
annual_value_inr = 0
value_basis      = "gateway"
# "Registration on e-Shram portal is free. Workers are not required to pay any
#  charges to any registering entity." (Q15)
premium_inr      = 0
# ! Rechecked 2026-09-07: visible FAQ Q13/Q42 describes registration and benefit
# ! facilitation, not a current promise of automatic insurance or free premium.
summary_hi       = "यह पैसा देने वाली योजना नहीं है — अभी e-Shram से केवल पंजीकरण होता है। यह मज़दूरों का सरकारी पहचान पत्र (UAN) है, जिससे योजनाओं तक पहुँचने में मदद मिलती है। खेत मज़दूर और भूमिहीन किसान भी पंजीकरण करा सकते हैं। पंजीकरण मुफ़्त है, कार्ड कभी ख़त्म नहीं होता, और 60 साल के होने पर कुछ नहीं बदलता। हर जुड़ी योजना की पात्रता और आवेदन की शर्तें अलग हैं।"
# ! Q42, in the ministry's own words: "Right now, only registration is being
# ! done through e-Shram." That is why this file carries no rupee value and
# ! why the summary leads with what it is NOT.
# ! Q37 settles a row the 7 September audit left open: "Agriculture labours
# ! and landless farmers are eligible for registration in the e-Shram
# ! portal." Said plainly below, because agricultural workers are a large
# ! part of who this bot is for and many assume it is not for them.
# ? Farmers who OWN land are still not addressed either way by the FAQ.
# ? Nothing is encoded about landholding, because "landless farmers are
# ? eligible" is not the same sentence as "landowning farmers are not".
# ! Q29: turning 60 needs no action and the UAN stays valid, which is the
# ! current source for having no upper age limit here.
summary_en       = "A registration service with no payout of its own — right now, only registration happens through e-Shram. It gives unorganised workers a UAN card to help access schemes. Agricultural labourers and landless farmers can register. Registration is free, the card does not expire, and turning 60 changes nothing. Linked schemes have separate eligibility and application requirements."

# =====================================================================
# ELIGIBILITY — ALL [[criteria]] must pass.
# =====================================================================

[[criteria]]
# * Source comparison 2026-09-08: worker status is a separate condition.
# * Occupation and zero income do not establish or disprove this by themselves.
field      = "is_unorganised_worker"
op         = "eq"
value      = true
ask_hi     = "क्या आप असंगठित क्षेत्र में कमाई वाला काम करते हैं?"
pass_hi    = "आपने बताया कि आप असंगठित क्षेत्र में काम करते हैं।"
fail_hi    = "इस योजना के लिए असंगठित क्षेत्र में काम करना ज़रूरी है।"
ask_en     = "Do you do income-earning work in the unorganised sector?"
pass_en    = "You reported that you work in the unorganised sector."
fail_en    = "This scheme requires work in the unorganised sector."
source_url = "https://eshram.gov.in/faqs"

[[criteria]]
# "A person aged 16 years or above who is engaged in unorganised work may
#  register on eShram, subject to the applicable eligibility conditions."
# ! No upper bound is stated on that page, so none is encoded. The FAQ elsewhere
# ! says "No action is required merely because the worker turns 60", which reads
# ! as no upper cut-off. `gte` rather than a made-up `between`.
field      = "age"
op         = "gte"
value      = 16
ask_hi     = "आपकी उम्र कितनी साल है?"
pass_hi    = "आपकी उम्र 16 साल या उससे ऊपर है, जो पंजीकरण के लिए ज़रूरी है"
fail_hi    = "ई-श्रम में 16 साल या उससे ऊपर की उम्र पर ही पंजीकरण होता है।"
ask_en     = "How old are you?"
pass_en    = "You are 16 or older, which registration requires."
fail_en    = "e-Shram registration is only for people aged 16 and above."
source_url = "https://eshram.gov.in/faqs"

# =====================================================================
# EXCLUSIONS
# =====================================================================

[[exclusions]]
# "There are no income criteria for registering on e-Shram as unorganised
#  worker. However, the worker should not be an income tax payee." (Q10)
field      = "is_income_tax_payer"
op         = "eq"
value      = true
reason_hi  = "आयकर (इनकम टैक्स) भरने वाले ई-श्रम में पंजीकरण नहीं कर सकते।"
reason_en  = "Income tax payers cannot register on e-Shram."
source_url = "https://eshram.gov.in/faqs"

[[exclusions]]
# "Any worker who is a home-based worker, self-employed worker or a wage worker
#  working in the unorganised sector and not a member of ESIC or EPFO, is called
#  an unorganised worker." (Q3)
# ! ESIC and EPFO only. The FAQ sentence above names exactly those two and does
# ! NOT mention NPS, so NPS is deliberately absent from this exclusion — a
# ! worker holding NPS alone still registers for e-Shram. Until 2026-09-03 one
# ! profile field covered all three and this scheme inherited PM-SYM's NPS bar,
# ! which turned an eligible worker away from the gateway to every other
# ! scheme. Do not re-add NPS here without a source sentence that names it.
field      = "is_epfo_or_esic_member"
op         = "eq"
value      = true
reason_hi  = "आप पीएफ (EPFO) या ईएसआईसी के सदस्य हैं — ऐसे मज़दूर संगठित क्षेत्र में गिने जाते हैं, इसलिए ई-श्रम पंजीकरण नहीं होता"
reason_en  = "You are a member of EPFO or ESIC — such workers count as organised sector, so e-Shram registration is not available."
source_url = "https://eshram.gov.in/faqs"

# =====================================================================
# PAPERWORK
# =====================================================================
[paperwork]
# "Aadhaar Number; Aadhaar linked Mobile number. Note: If a worker does not have
#  Aadhaar linked mobile number, he/ she may visit nearest Common Service Centre
#  (CSC) or State Seva Kendra (SSK) and register through biometric
#  authentication." (Q12)
# ! Only what Q12 calls essential. Bank details are captured during
# ! registration (Q11) but are not listed as a required document, so they are
# ! not shown as one.
documents      = ["आधार कार्ड", "आधार से जुड़ा मोबाइल नंबर (न हो तो केंद्र पर अंगूठे से पंजीकरण हो जाता है)"]
documents_en   = ["Aadhaar card", "Aadhaar-linked mobile number (if you have none, a centre can register you by fingerprint)"]
where_to_apply = "eshram_centre"
# "The e-Shram card never expires." (Q16) / "there is no need to renew" (Q17)
renewal        = "कोई नवीनीकरण नहीं। कार्ड कभी ख़त्म नहीं होता, पर जानकारी बदलने पर अपडेट करा लें।"
renewal_en     = "Nothing to renew. The card never expires, but update it if your details change."
