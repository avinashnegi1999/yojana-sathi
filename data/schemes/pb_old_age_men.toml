pass_en = "You reported living in Punjab; the Patwari (village) or EO (town) checks residence."
pass_hi = "आपने पंजाब में रहना बताया; पटवारी (गाँव) या ईओ (शहर) निवास जाँचेगा।"
fail_en = "This is Punjab's own pension; in your state, ask about the old-age pension there."
fail_hi = "यह पंजाब की अपनी पेंशन है; अपने राज्य में वहाँ की वृद्धावस्था पेंशन के बारे में पूछें।"
source_url = "https://sswcd.punjab.gov.in/en/social-security/pensionsfinancial-assistance"

