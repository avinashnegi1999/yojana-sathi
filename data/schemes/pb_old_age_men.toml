ask_hi = "महीने की कमाई लगभग कितनी है?"
pass_en = "Your reported income is within ₹5,000 a month (₹60,000 a year). The page counts all income, including rent and interest."
pass_hi = "आपकी बताई आय ₹5,000 महीना (₹60,000 साल) के भीतर है। पेज पर किराया और ब्याज समेत पूरी आय गिनी जाती है।"
fail_en = "This pension is for total income of ₹60,000 a year (₹5,000 a month) or less."
fail_hi = "यह पेंशन साल में ₹60,000 (₹5,000 महीना) या कम कुल आय वालों के लिए है।"
source_url = "https://sswcd.punjab.gov.in/en/social-security/pensionsfinancial-assistance"

