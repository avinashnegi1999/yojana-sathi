ask_hi = "क्या आपके और आपके पति/पत्नी के नाम मिलाकर 2.5 एकड़ से अधिक सिंचित (नहरी/चाही) ज़मीन, या 5 एकड़ से अधिक बरानी या जलभराव वाली ज़मीन है?"
pass_en = "You reported land within the limit; the Patwari or EO checks it."
pass_hi = "आपने सीमा के भीतर ज़मीन बताई; पटवारी या ईओ इसे जाँचेगा।"
