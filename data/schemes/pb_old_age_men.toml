# SIGNED 27 September 2026 by Avinash Negi (see verified_by). Drafted the
# same day; the checklist below is what was checked.
#
# * What this is: Punjab's own old-age pension, ₹1,500 a month, for men aged 65 and above.
# * The source sets a different age for women (58) and men (65). The rule
# * engine ANDs criteria and cannot say "58 if a woman, else 65", so the one
# * scheme is TWO files: PB_OLD_AGE_WOMEN and PB_OLD_AGE_MEN. Both sit in
# * exclusive_group "uk_state_pension" with IGNOAPS, so nothing is ever added
# * twice — the page does not say how the state pension and NSAP combine.
#
# ! Source: Department of Social Security and Women & Child Development,
# ! Punjab, page "Pensions/Financial Assistance", last updated 14-09-2026,
# ! read 2026-09-27: https://sswcd.punjab.gov.in/en/social-security/pensionsfinancial-assistance
# ! Research note: docs/research/states/PB.md, row 1.
# ! Evidence copy (printed 2026-09-27, 3 pages):
# ! docs/audit-evidence/pb-pensions-2026-09-27.pdf
#
# Before signing, open the page and find:
#   1. "i) Old Age Pension": "pension is granted to women of 58 years of age
#      and above and to men of 65 years of age and above. Total annual Income
#      should not be more than Rs. 60,000/- including business or rental or
#      interest income. The Applicant having maximum 2.5 Acre Nehri/Chahi
#      land or maximum 5 Acre Barani land ownership and 5 Acre land in
#      waterlogged area (including husband & wife) is also eligible".
#   2. "6) Rate of Pension": "increased from Rs.750/- to Rs. 1500/- per month
#      w.e.f 1st July, 2021." = 18,000 a year.
#   3. "3) ... A self declaration saying that: i) I am not in Govt. or private
#      employment. ii) I am not a self employed. ... vii) I am not an Income
#      Tax Payee."
#   4. "2) Required Documents" and "4) Procedure for Sanction".
#
# ? Income: the app asks what the worker EARNS a month; the page counts total
# ? income "from any source including interest/rental". ₹60,000 a year is
# ? exactly ₹5,000 a month, the top of the "Up to ₹5,000" band. Someone with
# ? rent or interest on top of low earnings is told ELIGIBLE; the declaration
# ? and the Patwari/EO check catch it.
# ? Declaration items NOT encoded (no question for them): commercial property,
# ? a house over 200 sq m in a town, VAT registration, professional tax. The
# ? summary says they are on the declaration.
# ? is_woman is shared with PM Ujjwala, whose wording is "a woman applying in
# ? your own name". A woman who answers "no" there is sent to the men's rule.
# ? Hindi text below is machine-drafted; it joins the Hindi review.
code = "PB_OLD_AGE_MEN"
name_en = "Punjab old-age pension (men, 65+)"
name_hi = "पंजाब वृद्धावस्था पेंशन (पुरुष, 65+)"
authority = "Department of Social Security and Women & Child Development, Government of Punjab"
official_url = "https://sswcd.punjab.gov.in/en/social-security/pensionsfinancial-assistance"
verified_on = "2026-09-27"
verified_by = "Avinash Negi, checked 2026-09-27"

[benefit]
annual_value_inr = 18000
value_basis = "annual_payout"
exclusive_group = "uk_state_pension"
premium_inr = 0
summary_en = "₹1,500 a month from the Punjab government for men aged 65 and above, with total income of ₹60,000 a year or less, not in a job or self-employed, and land within the limit. You will sign a declaration that you have no commercial property, no house over 200 sq m in a town, and pay no income tax, VAT or professional tax. You get one pension, not two. Get the form at your panchayat, block (BDPO), Sewa Kendra, Anganwadi or the District Social Security Officer."
summary_hi = "पंजाब सरकार की ओर से 65 साल या उससे ऊपर के पुरुषों के लिए ₹1,500 हर महीने, जिनकी कुल आय साल में ₹60,000 या कम हो, जो नौकरी या अपना काम न करते हों, और जिनकी ज़मीन सीमा के भीतर हो। आपको घोषणा देनी होगी कि आपके पास कोई व्यावसायिक संपत्ति नहीं, शहर में 200 वर्ग मीटर से बड़ा घर नहीं, और आप आयकर, वैट या प्रोफ़ेशनल टैक्स नहीं भरते। पेंशन एक ही मिलती है, दो नहीं। फ़ॉर्म पंचायत, ब्लॉक (BDPO), सेवा केंद्र, आंगनवाड़ी या ज़िला सामाजिक सुरक्षा अधिकारी से लें।"

[[criteria]]
