[paperwork]
documents_en = ["One proof of age: Aadhaar card, voter card, voter-list entry, matriculation certificate or birth certificate", "Signed self-declaration (no job, not self-employed, land, income, property, taxes)", "Aadhaar number, mobile number and bank account number", "Application form"]
