summary_en = "A monthly pension in Sikkim for people aged 60 and above in a BPL household with an Antyodaya or Priority Household ration card: ₹1,500 a month from 60, ₹2,000 from 70 and ₹2,500 from 80. You get one pension, not two. Register on Sikkim's online pension portal."
