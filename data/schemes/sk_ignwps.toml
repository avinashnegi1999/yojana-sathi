# SIGNED 27 September 2026 by Avinash Negi (see verified_by), against
# docs/audit-evidence/sk-pension-schemes-2026-09-27.pdf. Drafted the same day;
# the checklist below is what was checked (entry age 21 accepted as on the page).
#
# * What this is: the national widow pension (IGNWPS) at Sikkim's amount. The
# * national file (ignwps.toml) carries only the central share, ₹300 a month
# * (₹500 from 80); Sikkim's page gives ₹2,000 a month, "Central and State
# * Share". Both files share exclusive_group "uk_state_pension", so they are
# * never added: the group keeps the larger, which is this one.
#
# ! Source: pension registration portal, Government of Sikkim, read
# ! 2026-09-27: https://pensionscheme.sikkim.gov.in/
# ! Research note with every quote: docs/research/states/SK.md, row 2.
# ! Evidence copy (printed 2026-09-27, 3 pages) — the same PDF as SK_IGNOAPS:
# ! docs/audit-evidence/sk-pension-schemes-2026-09-27.pdf
#
# Before signing, open the page and find:
#   1. "Eligibility Criterias" (page 1), four conditions for every scheme:
#      SSC/COI/Residential Certificate; BPL household with an Antyodaya or
#      Priority Household ration card; Aadhaar; a Jan Dhan bank account.
#   2. Widow card (page 2, the wide card at the top): "Should Have Attained
#      the age of 21 and above." "Death Certificate of Husband bearing name of
#      legal wife/widow." "Non-marriage Certificate."
#   3. "Incentives/Financial Assistance" table (page 2), IGNWPS row:
#      "Rs. 2000/- per month. The above amount consists of Central and State
#      Share." = 24,000 a year.
#
# ? Age 21, not the national 40. The central share only starts at 40, so
# ? Sikkim appears to pay widows aged 21–39 from its own funds under the same
# ? name. The page says 21; this file follows the page. Confirm.
# ? No higher rate from 80 is listed, so there is no age band. The national
# ? ₹500 at 80 (₹6,000 a year) is below ₹24,000, so the group still keeps this.
# ? The card is matched to the widow scheme by its content (husband's death
# ? certificate); the page does not label the cards. Confirm on the live page.
# ? `is_bpl` stands in for "AAY or Priority Household ration card", as in
# ? SK_IGNOAPS. Hindi text below is machine-drafted; it joins the Hindi review.
