[benefit]
annual_value_inr = 24000
value_basis = "annual_payout"
exclusive_group = "uk_state_pension"
premium_inr = 0
summary_en = "A monthly pension of ₹2,000 in Sikkim for widows aged 21 and above in a BPL household with an Antyodaya or Priority Household ration card. You need your husband's death certificate and a certificate that you have not remarried. You get one pension, not two. Register on Sikkim's online pension portal."
summary_hi = "सिक्किम में अंत्योदय या प्राथमिकता परिवार राशन कार्ड वाले बीपीएल परिवार की 21 साल या उससे ऊपर की विधवाओं के लिए ₹2,000 हर महीने की पेंशन। पति का मृत्यु प्रमाणपत्र और दोबारा शादी न करने का प्रमाणपत्र चाहिए। पेंशन एक ही मिलती है, दो नहीं। सिक्किम के ऑनलाइन पेंशन पोर्टल पर पंजीकरण करें।"

