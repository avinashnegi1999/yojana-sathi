<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1410 690" role="img" aria-labelledby="title desc">
<title id="title">System map</title><desc id="desc">Telegram, WhatsApp and the web page feed one conversation, which asks the state first and only the needed questions. A rule engine over signed scheme files returns the verdict. Outputs are the explanation and a one-page sheet. An optional model may suggest an occupation for the worker to confirm, never a verdict. Measurement keeps only consented, coarse events.</desc>
<style>
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.h{font-size:36px;font-weight:600;fill:#1d1d1f;letter-spacing:-0.28px}
.eyebrow{font-size:14px;font-weight:600;fill:#0066cc;letter-spacing:0.5px}
.sub{font-size:19px;fill:#6e6e73}
.t{font-size:20px;font-weight:600;fill:#1d1d1f;letter-spacing:-0.2px}
.s{font-size:16px;fill:#6e6e73}
.td{font-size:20px;font-weight:600;fill:#ffffff;letter-spacing:-0.2px}
.sd{font-size:16px;fill:#a1a1a6}
.n{font-size:14px;font-weight:600;fill:#ffffff}
.chip{font-size:18px;font-weight:600;fill:#1d1d1f}
.foot{font-size:16px;fill:#1d1d1f}
.arrow{stroke:#0066cc;stroke-width:2;fill:none;marker-end:url(#a)}
.dash{stroke:#0066cc;stroke-width:2;fill:none;stroke-dasharray:6 6}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0066cc"/></marker></defs>
<rect width="1410" height="690" fill="#ffffff"/>
<text x="60" y="64" class="eyebrow">SYSTEM MAP</text>
<text x="60" y="108" class="h">One conversation. One rule engine. Three channels.</text>
<rect x="60" y="180" width="220" height="90" rx="18" fill="#f5f5f7"/>
<text x="82" y="214" class="t">Telegram</text>
<text x="82" y="242" class="s">Buttons</text>
<path d="M280 225 H340 V335 H356" class="arrow"/>
<rect x="60" y="290" width="220" height="90" rx="18" fill="#f5f5f7"/>
<text x="82" y="324" class="t">WhatsApp</text>
<text x="82" y="352" class="s">Buttons</text>
<path d="M280 335 H356" class="arrow"/>
<rect x="60" y="400" width="220" height="90" rx="18" fill="#f5f5f7"/>
<text x="82" y="434" class="t">Web page</text>
<text x="82" y="462" class="s">Map + buttons</text>
<path d="M280 445 H340 V335 H356" class="arrow"/>
<rect x="360" y="250" width="280" height="170" rx="18" fill="#f5f5f7"/>
<circle cx="392" cy="282" r="14" fill="#0066cc"/><text x="392" y="287" text-anchor="middle" class="n">1</text>
<text x="382" y="332" class="t">Conversation</text>
<text x="382" y="360" class="s">State first, then</text>
<text x="382" y="382" class="s">only the questions</text>
<text x="382" y="404" class="s">the chosen schemes need</text>
<rect x="700" y="220" width="300" height="230" rx="18" fill="#272729"/>
<circle cx="732" cy="252" r="14" fill="#0066cc"/><text x="732" y="257" text-anchor="middle" class="n">2</text>
<text x="722" y="302" class="td">Rule engine</text>
<text x="722" y="330" class="sd">Signed scheme files in,</text>
<text x="722" y="352" class="sd">a verdict out.</text>
<text x="722" y="374" class="sd"></text>
<text x="722" y="396" class="sd">Eligible · Ineligible ·</text>
<text x="722" y="418" class="sd">Unknown</text>
<path d="M640 335 H696" class="arrow"/>
<rect x="1060" y="180" width="290" height="150" rx="18" fill="#f5f5f7"/>
<circle cx="1092" cy="212" r="14" fill="#0066cc"/><text x="1092" y="217" text-anchor="middle" class="n">3</text>
<text x="1082" y="262" class="t">Explanation</text>
<text x="1082" y="290" class="s">Why, in her language</text>
<text x="1082" y="312" class="s">What to carry</text>
<rect x="1060" y="350" width="290" height="150" rx="18" fill="#f5f5f7"/>
<circle cx="1092" cy="382" r="14" fill="#0066cc"/><text x="1092" y="387" text-anchor="middle" class="n">4</text>
<text x="1082" y="432" class="t">One-page sheet</text>
<text x="1082" y="460" class="s">Documents and</text>
<text x="1082" y="482" class="s">where to go</text>
<path d="M1000 300 H1030 V255 H1056" class="arrow"/>
<path d="M1000 370 H1030 V425 H1056" class="arrow"/>
<rect x="360" y="490" width="280" height="150" rx="18" fill="#f5f5f7"/>
<text x="382" y="524" class="t">Optional model</text>
<text x="382" y="552" class="s">May suggest an occupation</text>
<text x="382" y="574" class="s">for her to confirm.</text>
<text x="382" y="596" class="s">Never decides.</text>
<path d="M500 490 V424" class="dash"/>
<rect x="700" y="520" width="650" height="90" rx="18" fill="#f5f5f7"/>
<text x="722" y="554" class="t">Measurement</text>
<text x="722" y="582" class="s">Consented, coarse events under a random id. No name, phone or Aadhaar.</text>
<path d="M850 450 V516" class="dash"/>
</svg>
