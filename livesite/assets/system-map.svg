<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 748" role="img" aria-labelledby="smTitle smDesc">
  <title id="smTitle">How Yojana Sathi works, end to end</title>
  <desc id="smDesc">Workers reach the bot through Telegram, WhatsApp or a terminal preview. A button-led conversation builds a session-only profile. Source-cited TOML scheme rules and that profile enter a deterministic rule engine, which returns eligible, ineligible or unknown. Outputs are an explained verdict, a document checklist, a one-page application pack and guidance on where to begin. Separately, a consented coarse event log feeds a duplicate-safe reach counter and an impact report. An optional language model only suggests an occupation label and never decides eligibility.</desc>
  <style>
    .bg{fill:#fffdf7}
    .zone{fill:none;stroke:#cfc6b1;stroke-width:2}
    .zn{fill:#e77833;font:800 15px Arial,Helvetica,sans-serif;letter-spacing:1.5px}
    .zh{fill:#14221c;font:700 19px Georgia,serif}
    .zs{fill:#5c675d;font:400 13px Arial,Helvetica,sans-serif}
    .card{fill:#fffdf7;stroke:#14221c;stroke-width:2}
    .ct{fill:#14221c;font:700 16px Georgia,serif}
    .cb{fill:#5c675d;font:400 12.5px Arial,Helvetica,sans-serif}
    .dark{fill:#173f32;stroke:#14221c;stroke-width:2}
    .dt{fill:#fffdf7;font:700 19px Georgia,serif}
    .db{fill:#d1ddd4;font:400 12.5px Arial,Helvetica,sans-serif}
    .lime{fill:#d6f05c;stroke:#14221c;stroke-width:2}
    .chip{font:800 12px Arial,Helvetica,sans-serif;letter-spacing:.6px;text-anchor:middle}
    .edge{fill:none;stroke:#657066;stroke-width:2.5}
    .edge-d{fill:none;stroke:#657066;stroke-width:2;stroke-dasharray:6 5}
    .head{fill:#14221c;font:800 34px Georgia,serif}
    .sub{fill:#5c675d;font:400 16px Arial,Helvetica,sans-serif}
    .foot{fill:#5c675d;font:600 13px Arial,Helvetica,sans-serif}
    .num{fill:#fffdf7;font:800 15px Arial,Helvetica,sans-serif;text-anchor:middle}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="#657066"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="748" rx="28"/>
  <text class="head" x="700" y="52" text-anchor="middle">How Yojana Sathi works</text>
  <text class="sub" x="700" y="79" text-anchor="middle">Channels, decision core, outputs, and the measurement it is allowed to keep</text>

  <!-- ZONE 1 : channels -->
  <rect class="zone" x="30" y="104" width="292" height="416" rx="14"/>
  <circle cx="56" cy="136" r="13" fill="#173f32"/><text class="num" x="56" y="141">1</text>
  <text class="zn" x="78" y="133">CHANNELS</text>
  <text class="zs" x="78" y="151">One rule engine, several front doors</text>

  <rect class="card" x="52" y="178" width="248" height="62" rx="8"/>
  <text class="ct" x="70" y="205">Worker, or a helper</text>
  <text class="cb" x="70" y="225">Often low literacy, on a shared phone</text>

  <rect class="lime" x="52" y="256" width="248" height="62" rx="8"/>
  <text class="ct" x="70" y="283">Telegram bot</text>
  <text class="cb" x="70" y="303" fill="#173f32">Live · primary channel</text>

  <rect class="card" x="52" y="334" width="248" height="62" rx="8"/>
  <text class="ct" x="70" y="361">WhatsApp bot</text>
  <text class="cb" x="70" y="381">Meta test tier · limited recipients</text>

  <rect class="card" x="52" y="412" width="248" height="62" rx="8"/>
  <text class="ct" x="70" y="439">Terminal preview</text>
  <text class="cb" x="70" y="459">For review, no message is sent</text>

  <path class="edge" d="M304 300 H344" marker-end="url(#a)"/>

  <!-- ZONE 2 : decision core -->
  <rect class="zone" x="352" y="104" width="620" height="416" rx="14"/>
  <circle cx="378" cy="136" r="13" fill="#173f32"/><text class="num" x="378" y="141">2</text>
  <text class="zn" x="400" y="133">DECISION CORE</text>
  <text class="zs" x="400" y="151">Ask the least, then decide by rule</text>

  <rect class="card" x="374" y="240" width="176" height="136" rx="8"/>
  <text class="ct" x="392" y="268">Conversation</text>
  <text class="cb" x="392" y="291">Consent, then language</text>
  <text class="cb" x="392" y="311">Buttons before typing</text>
  <text class="cb" x="392" y="331">“Don’t know” allowed</text>
  <text class="cb" x="392" y="351">Hindi is the default</text>

  <path class="edge" d="M552 308 H586" marker-end="url(#a)"/>

  <rect class="card" x="588" y="240" width="140" height="136" rx="8"/>
  <text class="ct" x="606" y="268">Profile</text>
  <text class="cb" x="606" y="288">In memory only</text>
  <text class="cb" x="606" y="311">state · age</text>
  <text class="cb" x="606" y="331">occupation</text>
  <text class="cb" x="606" y="351">income band</text>

  <path class="edge" d="M730 308 H756" marker-end="url(#a)"/>

  <rect class="card" x="758" y="164" width="192" height="86" rx="8"/>
  <text class="ct" x="776" y="190">Scheme rules</text>
  <text class="cb" x="776" y="211">One TOML file per scheme</text>
  <text class="cb" x="776" y="231">Official source + review date</text>

  <path class="edge" d="M854 252 V268" marker-end="url(#a)"/>

  <rect class="dark" x="758" y="270" width="192" height="176" rx="8"/>
  <text class="dt" x="776" y="300">Rule engine</text>
  <text class="db" x="776" y="322">Same answers, same result.</text>
  <text class="db" x="776" y="341">No network call in the path.</text>
  <rect x="776" y="356" width="156" height="26" rx="4" fill="#e77833"/>
  <text x="854" y="374" class="chip" fill="#fffdf7">NO LLM IN THE VERDICT</text>
  <rect x="776" y="390" width="49" height="24" rx="4" fill="#d6f05c"/>
  <text x="800" y="407" class="chip" fill="#173f32">YES</text>
  <rect x="830" y="390" width="49" height="24" rx="4" fill="#fffdf7"/>
  <text x="854" y="407" class="chip" fill="#14221c">NO</text>
  <rect x="884" y="390" width="49" height="24" rx="4" fill="#5c675d"/>
  <text x="908" y="407" class="chip" fill="#fffdf7">?</text>
  <text class="db" x="776" y="432">Eligible · ineligible · unknown</text>

  <rect class="card" x="374" y="398" width="354" height="76" rx="8" stroke-dasharray="7 5"/>
  <text class="ct" x="392" y="424">Optional language model</text>
  <text class="cb" x="392" y="445">Suggests an occupation label from free text, which the</text>
  <text class="cb" x="392" y="463">worker confirms. It never reads a threshold or writes a verdict.</text>
  <path class="edge-d" d="M462 380 V396" marker-end="url(#a)"/>

  <!-- ZONE 3 : outputs -->
  <rect class="zone" x="1002" y="104" width="368" height="416" rx="14"/>
  <circle cx="1028" cy="136" r="13" fill="#173f32"/><text class="num" x="1028" y="141">3</text>
  <text class="zn" x="1050" y="133">WHAT THE WORKER LEAVES WITH</text>
  <text class="zs" x="1050" y="151">A reason, not only a result</text>

  <path class="edge" d="M954 358 H978 V212 H1020" marker-end="url(#a)"/>
  <path class="edge" d="M978 358 H1020" marker-end="url(#a)"/>
  <path class="edge" d="M978 358 V500 H1020" marker-end="url(#a)"/>

  <rect class="card" x="1022" y="182" width="326" height="62" rx="8"/>
  <text class="ct" x="1040" y="209">Explained verdict</text>
  <text class="cb" x="1040" y="229">Which rule decided it, and the amount in ₹</text>

  <rect class="card" x="1022" y="258" width="326" height="62" rx="8"/>
  <text class="ct" x="1040" y="285">Document checklist</text>
  <text class="cb" x="1040" y="305">What to carry before travelling anywhere</text>

  <rect class="card" x="1022" y="334" width="326" height="62" rx="8"/>
  <text class="ct" x="1040" y="361">One-page application pack</text>
  <text class="cb" x="1040" y="381">Built in memory, nothing stored</text>

  <rect class="lime" x="1022" y="410" width="326" height="62" rx="8"/>
  <text class="ct" x="1040" y="437">Where to begin</text>
  <text class="cb" x="1040" y="457" fill="#173f32">CSC, bank, portal — a kind of place, not an address</text>

  <!-- ZONE 4 : measurement -->
  <path class="edge" d="M854 448 V468 H340 V556" marker-end="url(#a)"/>
  <rect class="zone" x="30" y="562" width="1340" height="150" rx="14"/>
  <circle cx="56" cy="594" r="13" fill="#173f32"/><text class="num" x="56" y="599">4</text>
  <text class="zn" x="78" y="591">MEASUREMENT, WITH LIMITS</text>
  <text class="zs" x="78" y="609">Reach can be counted without knowing who anyone is</text>
  <text class="cb" x="78" y="646">The screening profile is</text>
  <text class="cb" x="78" y="664">discarded when the chat ends.</text>
  <text class="cb" x="78" y="682">Only consented, coarse events</text>
  <text class="cb" x="78" y="700">continue past this line.</text>

  <rect class="card" x="392" y="596" width="296" height="96" rx="8"/>
  <text class="ct" x="410" y="623">Consented event log</text>
  <text class="cb" x="410" y="645">Written only after the worker agrees</text>
  <text class="cb" x="410" y="664">State, age band, income band, occupation</text>
  <text class="cb" x="410" y="683">Random session id · never a name or number</text>

  <path class="edge" d="M692 644 H726" marker-end="url(#a)"/>

  <rect class="card" x="728" y="596" width="278" height="96" rx="8"/>
  <text class="ct" x="746" y="623">Reach counter</text>
  <text class="cb" x="746" y="645">Hashed channel id, so one person</text>
  <text class="cb" x="746" y="664">returning is not counted twice</text>
  <text class="cb" x="746" y="683">Aggregate totals only</text>

  <path class="edge" d="M1010 644 H1044" marker-end="url(#a)"/>

  <rect class="lime" x="1046" y="596" width="302" height="96" rx="8"/>
  <text class="ct" x="1064" y="623">Impact report</text>
  <text class="cb" x="1064" y="645" fill="#173f32">A page anyone can open and check</text>
  <text class="cb" x="1064" y="664" fill="#173f32">Shows screenings and coverage</text>
  <text class="cb" x="1064" y="683" fill="#173f32">Never claims a benefit was received</text>

  <text class="foot" x="700" y="736" text-anchor="middle">Python standard library · TOML rules · SQLite · Telegram and WhatsApp adapters · Docker on a single small server</text>
</svg>
