<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Privacy</title><desc id="desc">Exact answers stay in memory for the chat. With consent, only an event with a random session id, the channel, the state and coarse bands is logged, and only aggregates are reported. Name, phone, Aadhaar, exact income and exact location are never stored.</desc>
<style>
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.h{font-size:36px;font-weight:600;fill:#1d1d1f;letter-spacing:-0.28px}
.eyebrow{font-size:14px;font-weight:600;fill:#0066cc;letter-spacing:0.5px}
.sub{font-size:19px;fill:#6e6e73}
.t{font-size:20px;font-weight:600;fill:#1d1d1f;letter-spacing:-0.2px}
.s{font-size:16px;fill:#6e6e73}
.td{font-size:20px;font-weight:600;fill:#ffffff;letter-spacing:-0.2px}
.sd{font-size:16px;fill:#a1a1a6}
.n{font-size:14px;font-weight:600;fill:#ffffff}
.chip{font-size:18px;font-weight:600;fill:#1d1d1f}
.foot{font-size:16px;fill:#1d1d1f}
.arrow{stroke:#0066cc;stroke-width:2;fill:none;marker-end:url(#a)}
.dash{stroke:#0066cc;stroke-width:2;fill:none;stroke-dasharray:6 6}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0066cc"/></marker></defs>
<rect width="1200" height="610" fill="#ffffff"/>
<text x="60" y="64" class="eyebrow">03 · PRIVACY</text>
<text x="60" y="108" class="h">Measure the flow. Never identify a person.</text>
<text x="60" y="142" class="sub">A pilot role separates testing from real use without asking who someone is.</text>
<rect x="60" y="200" width="300" height="190" rx="18" fill="#272729"/>
<circle cx="92" cy="232" r="14" fill="#0066cc"/><text x="92" y="237" text-anchor="middle" class="n">1</text>
<text x="82" y="282" class="td">Session profile</text>
<text x="82" y="310" class="sd">Exact answers live only</text>
<text x="82" y="332" class="sd">in memory, for this chat.</text>
<rect x="430" y="200" width="340" height="190" rx="18" fill="#f5f5f7"/>
<circle cx="462" cy="232" r="14" fill="#0066cc"/><text x="462" y="237" text-anchor="middle" class="n">2</text>
<text x="452" y="282" class="t">Consented event</text>
<text x="452" y="310" class="s">Random session id · channel</text>
<text x="452" y="332" class="s">State · age and income bands</text>
<text x="452" y="354" class="s">Optional: self / helping / tester</text>
<text x="452" y="376" class="s">Never the raw answers</text>
<rect x="840" y="200" width="300" height="190" rx="18" fill="#f5f5f7"/>
<circle cx="872" cy="232" r="14" fill="#0066cc"/><text x="872" y="237" text-anchor="middle" class="n">3</text>
<text x="862" y="282" class="t">Aggregate report</text>
<text x="862" y="310" class="s">Screenings · results</text>
<text x="862" y="332" class="s">Sheets · pilot role mix</text>
<path d="M360 295 H426" class="arrow"/>
<path d="M770 295 H836" class="arrow"/>
<path d="M210 390 V440 H600 V394" class="dash"/>
<text x="405" y="470" text-anchor="middle" class="t">The profile stops here.</text>
<rect x="60" y="520" width="1080" height="52" rx="18" fill="#f5f5f7"/>
<text x="600" y="552" text-anchor="middle" class="foot">Never stored: name · phone · Aadhaar · exact income · exact location</text>
</svg>
