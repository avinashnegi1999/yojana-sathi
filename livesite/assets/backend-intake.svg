<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Intake</title><desc id="desc">The worker consents, gives her state, chooses national schemes, her state's or both, ticks schemes or all of them, and answers only the questions those schemes need. The answers form a temporary profile in memory; nothing identifies her.</desc>
<style>
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.h{font-size:36px;font-weight:600;fill:#1d1d1f;letter-spacing:-0.28px}
.eyebrow{font-size:14px;font-weight:600;fill:#0066cc;letter-spacing:0.5px}
.sub{font-size:19px;fill:#6e6e73}
.t{font-size:20px;font-weight:600;fill:#1d1d1f;letter-spacing:-0.2px}
.s{font-size:16px;fill:#6e6e73}
.td{font-size:20px;font-weight:600;fill:#ffffff;letter-spacing:-0.2px}
.sd{font-size:16px;fill:#a1a1a6}
.n{font-size:14px;font-weight:600;fill:#ffffff}
.chip{font-size:18px;font-weight:600;fill:#1d1d1f}
.foot{font-size:16px;fill:#1d1d1f}
.arrow{stroke:#0066cc;stroke-width:2;fill:none;marker-end:url(#a)}
.dash{stroke:#0066cc;stroke-width:2;fill:none;stroke-dasharray:6 6}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0066cc"/></marker></defs>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="60" y="64" class="eyebrow">01 · INTAKE</text>
<text x="60" y="108" class="h">State first. Answer less.</text>
<text x="60" y="142" class="sub">Every question belongs to a signed scheme the worker chose.</text>
<rect x="60" y="190" width="200" height="170" rx="18" fill="#f5f5f7"/>
<circle cx="92" cy="222" r="14" fill="#0066cc"/><text x="92" y="227" text-anchor="middle" class="n">1</text>
<text x="82" y="272" class="t">Consent</text>
<text x="82" y="300" class="s">Nothing that</text>
<text x="82" y="322" class="s">identifies her</text>
<rect x="280" y="190" width="200" height="170" rx="18" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
<circle cx="312" cy="222" r="14" fill="#0066cc"/><text x="312" y="227" text-anchor="middle" class="n">2</text>
<text x="302" y="272" class="t">Her state</text>
<text x="302" y="300" class="s">All 36. A map on</text>
<text x="302" y="322" class="s">the web, buttons</text>
<text x="302" y="344" class="s">in chat</text>
<path d="M260 275 H276" class="arrow"/>
<rect x="500" y="190" width="200" height="170" rx="18" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
<circle cx="532" cy="222" r="14" fill="#0066cc"/><text x="532" y="227" text-anchor="middle" class="n">3</text>
<text x="522" y="272" class="t">Which schemes</text>
<text x="522" y="300" class="s">National, her</text>
<text x="522" y="322" class="s">state's, or both</text>
<path d="M480 275 H496" class="arrow"/>
<rect x="720" y="190" width="200" height="170" rx="18" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
<circle cx="752" cy="222" r="14" fill="#0066cc"/><text x="752" y="227" text-anchor="middle" class="n">4</text>
<text x="742" y="272" class="t">Pick from list</text>
<text x="742" y="300" class="s">Tick some, or</text>
<text x="742" y="322" class="s">"All of these"</text>
<path d="M700 275 H716" class="arrow"/>
<rect x="940" y="190" width="200" height="170" rx="18" fill="#f5f5f7"/>
<circle cx="972" cy="222" r="14" fill="#0066cc"/><text x="972" y="227" text-anchor="middle" class="n">5</text>
<text x="962" y="272" class="t">Questions</text>
<text x="962" y="300" class="s">Only what those</text>
<text x="962" y="322" class="s">schemes need.</text>
<text x="962" y="344" class="s">"Don't know" ok</text>
<path d="M920 275 H936" class="arrow"/>
<path d="M1040 360 V430 H844" class="arrow"/>
<rect x="356" y="400" width="480" height="110" rx="18" fill="#272729"/>
<text x="378" y="434" class="td">Temporary profile</text>
<text x="378" y="462" class="sd">State · age · income band · the facts those schemes need.</text>
<text x="378" y="484" class="sd">No identity inferred. A missing answer never becomes "no".</text>
</svg>
