<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Rule engine</title><desc id="desc">The temporary profile and the signed scheme files go into a deterministic rule engine. It returns eligible, ineligible or unknown. No language model decides a verdict.</desc>
<style>
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.h{font-size:36px;font-weight:600;fill:#1d1d1f;letter-spacing:-0.28px}
.eyebrow{font-size:14px;font-weight:600;fill:#0066cc;letter-spacing:0.5px}
.sub{font-size:19px;fill:#6e6e73}
.t{font-size:20px;font-weight:600;fill:#1d1d1f;letter-spacing:-0.2px}
.s{font-size:16px;fill:#6e6e73}
.td{font-size:20px;font-weight:600;fill:#ffffff;letter-spacing:-0.2px}
.sd{font-size:16px;fill:#a1a1a6}
.n{font-size:14px;font-weight:600;fill:#ffffff}
.chip{font-size:18px;font-weight:600;fill:#1d1d1f}
.foot{font-size:16px;fill:#1d1d1f}
.arrow{stroke:#0066cc;stroke-width:2;fill:none;marker-end:url(#a)}
.dash{stroke:#0066cc;stroke-width:2;fill:none;stroke-dasharray:6 6}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0066cc"/></marker></defs>
<rect width="1200" height="630" fill="#ffffff"/>
<text x="60" y="64" class="eyebrow">02 · RULE ENGINE</text>
<text x="60" y="108" class="h">The rules decide. The bot explains.</text>
<rect x="60" y="170" width="300" height="150" rx="18" fill="#f5f5f7"/>
<circle cx="92" cy="202" r="14" fill="#0066cc"/><text x="92" y="207" text-anchor="middle" class="n">A</text>
<text x="82" y="252" class="t">Temporary profile</text>
<text x="82" y="280" class="s">Answers from this chat only.</text>
<text x="82" y="302" class="s">Never an identity record.</text>
<rect x="60" y="360" width="300" height="150" rx="18" fill="#f5f5f7"/>
<circle cx="92" cy="392" r="14" fill="#0066cc"/><text x="92" y="397" text-anchor="middle" class="n">B</text>
<text x="82" y="442" class="t">Scheme files</text>
<text x="82" y="470" class="s">Plain text, cited sources,</text>
<text x="82" y="492" class="s">signed by a person.</text>
<rect x="430" y="220" width="330" height="240" rx="18" fill="#272729"/>
<circle cx="462" cy="252" r="14" fill="#0066cc"/><text x="462" y="257" text-anchor="middle" class="n">C</text>
<text x="452" y="302" class="td">Rule engine</text>
<text x="452" y="330" class="sd">Same answers, same verdict.</text>
<text x="452" y="352" class="sd"></text>
<text x="452" y="374" class="sd">No language model decides</text>
<text x="452" y="396" class="sd">eligibility.</text>
<path d="M360 245 H395 V300 H426" class="arrow"/>
<path d="M360 435 H395 V380 H426" class="arrow"/>
<path d="M760 340 H820" class="arrow"/>
<rect x="830" y="180" width="310" height="60" rx="18" fill="#f5f5f7"/>
<text x="852" y="206" class="chip">✓  Eligible</text>
<text x="852" y="228" class="s">Every rule is met</text>
<rect x="830" y="310" width="310" height="60" rx="18" fill="#f5f5f7"/>
<text x="852" y="336" class="chip">✕  Ineligible</text>
<text x="852" y="358" class="s">A stated rule fails</text>
<rect x="830" y="440" width="310" height="60" rx="18" fill="#f5f5f7"/>
<text x="852" y="466" class="chip">?  Unknown</text>
<text x="852" y="488" class="s">Missing answer or unsigned rule</text>
<path d="M820 340 V210 H826" class="arrow"/>
<path d="M820 340 V470 H826" class="arrow"/>
<rect x="60" y="548" width="1080" height="52" rx="18" fill="#f5f5f7"/>
<text x="600" y="580" text-anchor="middle" class="foot">The engine computes first. Language only presents the result.</text>
</svg>
