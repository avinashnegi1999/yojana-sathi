<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">How Yojana Sathi decides eligibility</title>
  <desc id="desc">A session profile and source cited scheme rules enter a deterministic engine. The engine returns eligible, ineligible, or unknown.</desc>
  <style>
    .bg{fill:#fffdf7}.edge{fill:none;stroke:#657066;stroke-width:4}.card{fill:#fffdf7;stroke:#14221c;stroke-width:3}.dark{fill:#173f32}.lime{fill:#d6f05c}.t{font:700 28px Georgia,serif;fill:#14221c}.sub{font:500 20px Arial,sans-serif;fill:#5c675d}.white{fill:#fffdf7}.mint{fill:#d7e5dc}.tag{font:800 17px Arial,sans-serif;letter-spacing:2px;fill:#e77833}.arrow{fill:#657066}
  </style>
  <rect class="bg" width="1200" height="560" rx="32"/>
  <text x="65" y="72" class="tag">02 / VERDICT</text>
  <text x="65" y="118" class="t">The rules decide. The language does not.</text>
  <rect class="card" x="65" y="196" width="250" height="155" rx="22"/>
  <text x="190" y="254" text-anchor="middle" class="t">Profile</text>
  <text x="190" y="294" text-anchor="middle" class="sub">session answers only</text>
  <path class="edge" d="M315 274H400"/><path class="arrow" d="M400 274l-20-12v24z"/>
  <rect class="card" x="65" y="385" width="250" height="105" rx="22"/>
  <text x="190" y="430" text-anchor="middle" class="t">Scheme file</text>
  <text x="190" y="463" text-anchor="middle" class="sub">source-cited TOML</text>
  <path class="edge" d="M315 438H400V300"/><path class="arrow" d="M400 300l-12 20h24z"/>
  <rect class="dark" x="425" y="164" width="330" height="230" rx="22"/>
  <text x="590" y="238" text-anchor="middle" class="t white">Deterministic engine</text>
  <text x="590" y="280" text-anchor="middle" class="sub mint">pure function · no I/O</text>
  <text x="590" y="314" text-anchor="middle" class="sub mint">no network · no LLM import</text>
  <text x="590" y="348" text-anchor="middle" class="sub mint">same inputs → same verdict</text>
  <path class="edge" d="M755 279H835"/><path class="arrow" d="M835 279l-20-12v24z"/>
  <path class="edge" d="M835 279V191H870M835 279H870M835 279V367H870"/>
  <rect class="card" x="870" y="145" width="265" height="90" rx="18"/><text x="1002" y="201" text-anchor="middle" class="t">ELIGIBLE</text>
  <rect class="card" x="870" y="234" width="265" height="90" rx="18"/><text x="1002" y="290" text-anchor="middle" class="t">INELIGIBLE</text>
  <rect class="lime" x="870" y="323" width="265" height="110" rx="18"/><text x="1002" y="373" text-anchor="middle" class="t">UNKNOWN</text><text x="1002" y="405" text-anchor="middle" class="sub">missing answer or unsigned rule</text>
</svg>
