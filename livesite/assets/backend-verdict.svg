<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic eligibility verdicts</title><desc id="desc">A temporary profile and human-signed scheme data enter the deterministic rule engine. The engine outputs eligible, ineligible, or unknown; no language model decides a verdict.</desc>
  <defs><linearGradient id="p" x1="0" x2="1"><stop stop-color="#eef7ff"/><stop offset="1" stop-color="#f9fcff"/></linearGradient><linearGradient id="r" x1="0" x2="1"><stop stop-color="#fff0f0"/><stop offset="1" stop-color="#fffafa"/></linearGradient><marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto"><path d="M0 0 10 4 0 8z" fill="#274d70"/></marker></defs>
  <style>.bg{fill:#fbfdff}.card{stroke:#bed5e7;stroke-width:2}.l{fill:none;stroke:#274d70;stroke-width:3;marker-end:url(#a)}.t{font:800 35px Arial,sans-serif;fill:#102c4b}.h{font:800 24px Arial,sans-serif;fill:#102c4b}.p{font:500 18px Arial,sans-serif;fill:#496680}.tag{font:800 15px Arial,sans-serif;letter-spacing:1.8px;fill:#e26953}.w{fill:#fff}</style>
  <rect class="bg" width="1200" height="650" rx="30"/><text class="tag" x="62" y="62">02 / RULE ENGINE</text><text class="t" x="62" y="108">The rules decide. The bot explains.</text>
  <rect class="card" fill="url(#p)" x="55" y="190" width="265" height="160" rx="22"/><circle fill="#4e9dd2" cx="92" cy="228" r="20"/><text x="92" y="235" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" class="w">A</text><text class="h" x="82" y="278">Temporary profile</text><text class="p" x="82" y="311">answers given in this chat</text><text class="p" x="82" y="337">never an identity record</text>
  <rect class="card" fill="#f4f0ff" x="55" y="404" width="265" height="150" rx="22"/><circle fill="#7769dc" cx="92" cy="442" r="20"/><text x="92" y="449" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" class="w">B</text><text class="h" x="82" y="488">Selected scheme data</text><text class="p" x="82" y="519">TOML · cited · human-signed</text>
  <path class="l" d="M320 270H410V315H442"/><path class="l" d="M320 478H410V350H442"/>
  <rect x="442" y="184" width="342" height="250" rx="26" fill="#102c4b"/><circle fill="#ef7663" cx="488" cy="228" r="20"/><text x="488" y="235" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" class="w">C</text><text x="613" y="278" text-anchor="middle" font-family="Arial" font-size="29" font-weight="800" fill="#fff">Deterministic rule engine</text><text x="613" y="324" text-anchor="middle" font-family="Arial" font-size="19" fill="#cfe5f5">same inputs → same verdict</text><rect x="500" y="352" width="226" height="42" rx="12" fill="#f4b955"/><text x="613" y="380" text-anchor="middle" font-family="Arial" font-size="17" font-weight="800" fill="#102c4b">LLM NEVER DECIDES ELIGIBILITY</text>
  <path class="l" d="M784 309H850"/><path fill="none" stroke="#274d70" stroke-width="3" d="M850 309V221H882M850 309H882M850 309V397H882"/>
  <g><rect class="card" fill="#e8faec" x="882" y="174" width="262" height="94" rx="18"/><text class="h" x="913" y="213">✓ Eligible</text><text class="p" x="913" y="242">rules are met</text></g><g><rect class="card" fill="url(#r)" x="882" y="274" width="262" height="94" rx="18"/><text class="h" x="913" y="313">× Ineligible</text><text class="p" x="913" y="342">a stated rule fails</text></g><g><rect class="card" fill="#fff7d9" x="882" y="374" width="262" height="112" rx="18"/><text class="h" x="913" y="414">? Unknown</text><text class="p" x="913" y="443">missing answer or</text><text class="p" x="913" y="467">unsigned rule</text></g>
  <rect x="196" y="582" width="808" height="34" rx="17" fill="#eaf2f8"/><text x="600" y="605" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#37546e">The engine computes first. Language is used only to present the result clearly.</text>
</svg>
